.eyebrow { color: var(--eyebrow); letter-spacing: 0.08em; font-family: var(--font-mono); font-weight: 500; }
/* Coding page */
.cpv { gap: 12px; }
.panel { border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.ptabs, .ctabs, .ehead { background: var(--surface); }
.ptabs button[aria-selected="true"], .ctabs button[role="tab"][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.ehead { gap: 6px; padding: 0 8px 0 14px; min-height: 46px; }
.ehead .btn { min-height: 30px; padding: 4px 14px; }
.editor { background: var(--editor-bg); color: var(--editor-ink); }
.editor .gutter { color: var(--gutter); border-right-color: var(--editor-line); }
.editor .hl { color: var(--editor-ink); }
.editor textarea { caret-color: #FFFFFF; }
.editor textarea::selection { background: rgba(95, 211, 141, 0.28); }
.editor:focus-within { box-shadow: inset 0 0 0 1px var(--accent-line); }
.editor .t-k { color: #FF7AB2; font-weight: 500; }
.editor .t-s { color: #8BD79B; }
.editor .t-n { color: #F6C177; }
.editor .t-c { color: #7C8577; font-style: italic; }
.editor .t-f { color: #B8A6F7; }
.casechip { border-radius: 999px; padding: 3px 12px; }
.casechip.on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
.casechip.pass.on { color: var(--ok); } .casechip.fail.on { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.vhead h3 { font-size: 1.3rem; letter-spacing: -0.01em; }
.subs { border-radius: 10px; overflow: hidden; }
.spin { border-top-color: var(--accent); }
.eacts { display: inline-flex; gap: 6px; margin-left: 4px; }
.kv > code { display: block; padding: 9px 12px; border-radius: 10px; font-size: 0.84rem; }
.fbtns .btn, .eacts .btn { white-space: nowrap; }
@media (max-width: 720px) { .topbar { padding-left: 10px; padding-right: 10px; } .topbar .wrap { padding-left: 14px; } }

/* Page headers (Companies, Roles) */
.pagehead { display: flex; flex-direction: column; gap: 10px; padding: 18px 0 6px; }
.pagehead h1, .cohead h1 { font-size: clamp(1.8rem, 3.2vw, 2.4rem); letter-spacing: -0.03em; line-height: 1.1; }
.pagehead h1 em { color: var(--em-color); font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; }
.bigsearch { max-width: 440px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); }
.bigsearch:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }

/* Company tags */
.comini { display: inline-flex; gap: 4px; margin-left: 4px; vertical-align: 1px; }
.cotag { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.cotag.rep { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.comore { font-size: 0.68rem; color: var(--muted); align-self: center; }
.cochips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.cochips .eyebrow { margin-right: 4px; }
.cochip { font-size: 0.78rem; font-weight: 500; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.cochip:hover { border-color: var(--hover-line); color: var(--hover-ink); }
.cochip.rep { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.coav { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--ink); color: var(--surface); font: 700 0.85rem/1 var(--font-body); letter-spacing: 0.02em; }
.coav.lg { width: 64px; height: 64px; border-radius: 16px; font-size: 1.2rem; }
.cogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.cocard { display: flex; gap: 14px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s, transform .15s; }
.cocard:hover { border-color: var(--hover-line); box-shadow: var(--shadow); transform: translateY(-1px); }
.cobody { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.cobody b { font-size: 1rem; }
.cobody small { color: var(--muted); font-size: 0.8rem; }
.costats { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.78rem; color: var(--ink); }
.costats > span:not(.cotag) { background: var(--surface-2); border-radius: 999px; padding: 1px 8px; }
.cobar { height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.cobar i { display: block; height: 100%; background: var(--accent); }
.conote { max-width: 80ch; }
.cohead { flex-direction: row; align-items: center; gap: 18px; flex-wrap: wrap; }
.cohtext { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
.cotabs { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; font-size: 0.86rem; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.subh { font-size: 0.95rem; margin: 6px 2px -4px; }

/* Home */
.main.home { padding-top: 0; gap: 0; max-width: none; }
.btn.big { padding: 11px 22px; font-size: 0.98rem; }
.hhero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 44px; align-items: center; padding-top: 64px; padding-bottom: 56px; }
.hcopy { display: flex; flex-direction: column; gap: 22px; }
.hhero h1 { font-size: clamp(2.4rem, 5vw, 3.9rem); line-height: 1.02; letter-spacing: -0.045em; font-weight: 700; }
.hhero h1 em { color: var(--em-color); font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.03em; display: inline-block; }
.hhero h1 em.in { animation: wordin .5s ease; }
@keyframes wordin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.hsub { font-size: 1.08rem; color: var(--muted); max-width: 46ch; border-top: 1px solid var(--line); padding-top: 18px; }
.hsub b { color: var(--ink); font-weight: 600; }
.langs { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.8rem; color: var(--muted); }
.langs i { font-style: normal; opacity: .5; }
.hcard { background: var(--editor-bg); color: var(--editor-ink); border-radius: 16px; box-shadow: 0 24px 60px rgba(34, 40, 32, 0.18); overflow: hidden; border: 1px solid #2C332D; }
.hbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2C332D; font-size: 0.8rem; color: #AEB5AA; }
.dots { display: inline-flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: #E5534B; } .dots i:nth-child(2) { background: #DFA43A; } .dots i:nth-child(3) { background: #5FB35F; }
.hrun { margin-left: auto; color: #86E2AA; font-weight: 600; }
.hrun.busy { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .4; } }
.hbody { display: grid; grid-template-columns: 1fr 1fr; min-height: 250px; }
.hvis { padding: 16px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid #2C332D; }
.hlab { font-size: 0.7rem; letter-spacing: 0.08em; color: #8C9488; }
.hstat { font-size: 0.75rem; color: #AEB5AA; margin-top: auto; }
.hcode { margin: 0; padding: 16px; font: 0.8rem/1.65 var(--font-mono); white-space: pre; overflow: auto; color: var(--editor-ink); background: color-mix(in srgb, var(--editor-bg) 88%, #FFFFFF); }
.hcode .t-k { color: #FF7AB2; font-style: normal; } .hcode .t-s { color: #8BD79B; font-style: normal; }
.hchecks { list-style: none; margin: 0; padding: 12px 16px; border-top: 1px solid #2C332D; display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: #8C9488; }
.hchecks li::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #5F685B; margin-right: 10px; vertical-align: -2px; transition: all .3s; }
.hchecks li.ok { color: #E6E9E3; } .hchecks li.ok::before { background: #5FD38D; border-color: #5FD38D; }
.wavesvg, .hvis svg { width: 100%; height: auto; }
.hvis svg text { fill: #AEB5AA; font: 11px var(--font-mono); }
.hvis .wclk, .hvis .wsig { fill: none; stroke: #86E2AA; stroke-width: 1.6; }
.hvis .wbus path { fill: none; stroke: #4A534A; stroke-width: 1.4; transition: stroke .3s, fill .3s; }
.hvis .wbus text { fill: #5F685B; text-anchor: middle; font-size: 9px; transition: fill .3s; }
.hvis .wbus.on path { stroke: #F6C177; fill: rgba(246, 193, 119, 0.12); } .hvis .wbus.on text { fill: #F6C177; }
.hvis .axis, .hvis .vth { fill: none; stroke: #4A534A; stroke-width: 1.2; } .hvis .vth { stroke-dasharray: 4 4; }
.hvis .curve { fill: none; stroke: #F6C177; stroke-width: 2; } .hvis .dot { fill: #fff; }
.hvis .lnode rect { fill: #2C332D; stroke: #86E2AA; } .hvis .lnode text { fill: #E6E9E3; text-anchor: middle; } .hvis .larr { stroke: #86E2AA; stroke-width: 1.5; fill: none; marker-end: none; }
.hvis .lab.mid { text-anchor: middle; }
.hvis .tring { fill: none; stroke: #2C332D; stroke-width: 8; } .hvis .tarc { fill: none; stroke: #86E2AA; stroke-width: 8; stroke-dasharray: 327; stroke-dashoffset: 80; transform: rotate(-90deg); transform-origin: 150px 75px; }
.hvis .ttxt { fill: #E6E9E3; font-size: 20px; text-anchor: middle; }
.viscos { display: flex; flex-wrap: wrap; gap: 6px; } .viscos .cotag { background: #2C332D; border-color: #3A423A; color: #CFD6CB; }
.hstrip { padding-top: 8px; padding-bottom: 40px; text-align: center; }
.hstrip p { font-size: 0.82rem; color: var(--muted); margin-bottom: 14px; }
.hcos { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px; }
.hcos button { border: 0; background: none; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; color: #8E938A; cursor: pointer; }
.hcos button:hover { color: var(--ink); }
.hsec { padding-top: 48px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 22px; }
.hh2 { font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: -0.03em; text-align: center; }
.hh2.left { text-align: left; }
.hplat { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
.hptabs { display: flex; flex-direction: column; gap: 8px; }
.hptabs button { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 13px 14px; font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all .15s; }
.hptabs button:hover { border-color: var(--hover-line); }
.hptabs button[aria-selected="true"] { border-color: var(--accent-line); background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
.hpi { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); font-size: 0.8rem; color: var(--muted); flex: none; }
.hpcard .hbody { min-height: 280px; }
.hmore { text-align: right; font-size: 0.88rem; }
.htopics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.htopic { display: flex; flex-direction: column; gap: 6px; text-align: left; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 0 0 16px; overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.htopic:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.htopic b, .htopic small { padding: 0 18px; } .htopic b { font-size: 1.02rem; margin-top: 8px; } .htopic small { color: var(--muted); font-size: 0.8rem; }
.hart { display: grid; place-items: center; height: 170px; }
.htopic.t0 .hart { background: #DDF1E3; } .htopic.t1 .hart { background: #DCE8F5; } .htopic.t2 .hart { background: #ECE5D4; }
.htopic.t3 .hart { background: #D5EDE9; } .htopic.t4 .hart { background: #F5EACB; } .htopic.t5 .hart { background: #E2E5E9; }
.art { width: 78%; height: auto; fill: none; stroke: #161616; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.art text { stroke: none; fill: #161616; font: 600 12px var(--font-mono); }
.art .soft { stroke: var(--lav); }
.art-gpu rect { fill: rgba(0, 117, 62, 0.22); }
.htry { padding: 0; gap: 0; overflow: hidden; }
.htrytabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.htrytabs button { border: 0; background: none; padding: 14px; font-size: 0.86rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.htrytabs button .mono { margin-right: 6px; opacity: .6; }
.htrytabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.htrybody { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 28px; padding: 26px; }
.htrybody h3 { font-size: 1.3rem; letter-spacing: -0.02em; }
.teq { margin-top: 10px; color: var(--accent); font-size: 0.95rem; }
.trywid { display: flex; flex-direction: column; gap: 14px; }
.trywid label { display: grid; grid-template-columns: 110px 1fr 90px; align-items: center; gap: 12px; font-size: 0.86rem; color: var(--muted); }
.trywid label b { color: var(--ink); text-align: right; font-family: var(--font-mono); font-weight: 500; }
.trywid input[type="range"] { accent-color: var(--accent); width: 100%; }
.tryout { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; }
.tryout span { font-size: 0.82rem; color: var(--muted); } .tryout b { font: 600 1.25rem var(--font-mono); color: var(--accent); }
.tryout.neg { background: var(--bad-soft); } .tryout.neg b { color: var(--bad); }
.bits { display: flex; gap: 6px; flex-wrap: wrap; }
.bit { width: 44px; height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font: 600 1.2rem var(--font-mono); cursor: pointer; }
.bit.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.hstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; text-align: center; padding-top: 56px; }
.hstats div { display: flex; flex-direction: column; gap: 4px; }
.hstats b { font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -0.04em; }
.hstats span { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hcta { position: relative; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: center; border-radius: 20px; padding: 44px; overflow: hidden;
  background: radial-gradient(90% 120% at 100% 100%, rgba(0, 117, 62, 0.14), transparent 60%), radial-gradient(60% 80% at 0% 0%, rgba(37, 99, 235, 0.06), transparent 60%), var(--surface); border: 1px solid var(--accent-line); }
.hcta > div:first-child { display: flex; flex-direction: column; gap: 16px; }
.hcta h2 { font-size: clamp(2rem, 4.5vw, 3.2rem); line-height: 1.02; letter-spacing: -0.04em; }
.hcta h2 em { color: var(--em-color); font-family: var(--font-serif); font-style: italic; font-weight: 400; }
.hcta p { color: var(--muted); max-width: 46ch; }
.ctaart { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; transform: perspective(600px) rotateX(28deg) rotateZ(-14deg); }
.ctaart i { aspect-ratio: 1; border-radius: 6px; background: var(--lav); opacity: calc(0.12 + var(--d) * 0.06); animation: diepulse 3.2s ease-in-out infinite; animation-delay: calc(var(--d) * 0.25s); }
@keyframes diepulse { 50% { opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .ctaart i, .hrun.busy, .hhero h1 em.in { animation: none; } }
.hfoot { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 24px; padding-top: 56px; padding-bottom: 40px; margin-top: 48px; border-top: 1px solid var(--line); }
.hfoot > div { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.hfoot b { font-size: 0.85rem; }
.linkbtn.plain { color: var(--muted); font-weight: 400; font-size: 0.88rem; }
.linkbtn.plain:hover { color: var(--ink); }
.hcopy2 { grid-column: 1 / -1; }
@media (max-width: 900px) {
  .hhero { grid-template-columns: 1fr; padding-top: 36px; gap: 28px; }
  .hplat, .htrybody, .hcta { grid-template-columns: 1fr; }
  .hptabs { flex-direction: row; overflow-x: auto; } .hptabs button { white-space: nowrap; }
  .htopics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hstats { grid-template-columns: repeat(2, 1fr); }
  .ctaart { display: none; }
  .hfoot { grid-template-columns: 1fr 1fr; } .hfoot > div:first-child { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .hbody { grid-template-columns: 1fr; } .hvis { border-right: 0; border-bottom: 1px solid #2C332D; }
  .htopics { grid-template-columns: 1fr; }
  .htrytabs { grid-template-columns: 1fr 1fr; }
  .trywid label { grid-template-columns: 90px 1fr 74px; }
  .hcta { padding: 26px; }
}

/* Sign-in screen */
body.authopen { overflow: hidden; }
#authpage { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; padding: 16px; }
.authl { display: flex; flex-direction: column; padding: 8px 8px 8px 16px; overflow: auto; }
.authtop { display: flex; justify-content: space-between; align-items: center; }
.authtop .brand { color: var(--ink); }
.authform { width: min(100%, 360px); margin: auto; display: flex; flex-direction: column; gap: 14px; padding: 24px 0; }
.authform h1 { font-size: 1.75rem; letter-spacing: -0.03em; }
.authbtn { width: 100%; padding: 10px; border-radius: 10px; font-weight: 500; gap: 10px; }
.author { display: flex; align-items: center; gap: 12px; font-size: 0.78rem; color: var(--muted); }
.author::before, .author::after { content: ""; flex: 1; height: 1px; background: var(--line); }
#authemail { display: flex; flex-direction: column; gap: 12px; }
#authemail label { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: var(--muted); font-weight: 500; }
#authemail input { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; background: var(--surface); color: var(--ink); }
#authemail input:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.authsubmit { width: 100%; padding: 11px; border-radius: 10px !important; }
.autherr { color: var(--bad); font-size: 0.84rem; background: var(--bad-soft); padding: 8px 12px; border-radius: 8px; }
.authinfo { color: var(--ok); font-size: 0.84rem; background: var(--ok-soft); padding: 8px 12px; border-radius: 8px; }
.authfine { text-align: center; }
.authr { position: relative; border-radius: 20px; background: radial-gradient(60% 60% at 50% 50%, #18221A, #0B0E0B); overflow: hidden; }
#authcanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.authquote { position: absolute; left: 32px; bottom: 28px; display: flex; flex-direction: column; color: #E6E9E3; font-size: 1.05rem; }
.authquote span { color: #8C9488; }
@media (max-width: 860px) { #authpage { grid-template-columns: 1fr; } .authr { display: none; } }

code, pre, .code-editor, .editor, .hcode, .mono { font-variant-ligatures: none; }

.ptable .c-co { width: 170px; white-space: nowrap; overflow: hidden; } .ptable .c-co .comini { margin-left: 0; }
.ctable .c-co { width: 170px; }
@media (max-width: 1240px) { .ptable:not(.ctable) .c-ty { display: none; } }

/* Roadmap: stages on one rail */
.realm.stage { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; }
.srail { position: relative; display: flex; justify-content: center; }
.srail::before { content: ""; position: absolute; top: 0; bottom: -24px; width: 2px; background: var(--line); }
.realm.stage:last-child .srail::before { bottom: auto; height: 44px; }
.snode { position: relative; z-index: 1; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface); border: 2px solid var(--line); color: var(--muted); margin-top: 6px; }
.snode svg { width: 18px; height: 18px; }
.stage.done .snode { background: var(--ok); border-color: var(--ok); color: var(--go-ink); }
.stage.done .srail::before { background: var(--accent-line); }
.stage.current .snode { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 5px var(--accent-soft); }
.stage.open .snode { border-color: var(--accent); color: var(--ink); }
.sbody { display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; min-width: 0; }
.sgoal { max-width: 70ch; margin-top: 2px; }
@media (max-width: 720px) { .realm.stage { grid-template-columns: 30px minmax(0, 1fr); gap: 10px; } .snode { width: 30px; height: 30px; font-size: 0.85rem; } }

/* Account button */
.avatar { overflow: hidden; display: grid; place-items: center; padding: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.guest { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.avatar.guest svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
#acct { display: inline-flex; align-items: center; gap: 10px; }

/* Profile */
.pfgrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.pfside, .pfmain { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pfwho { display: flex; gap: 14px; align-items: center; }
.pfwho h1 { font-size: 1.3rem; letter-spacing: -0.02em; }
.pfav { width: 72px; height: 72px; border-radius: 16px; flex: none; display: grid; place-items: center; background: var(--ink); color: var(--surface); font-size: 1.8rem; font-weight: 700; object-fit: cover; }
.pfquick { display: flex; gap: 8px; }
.pfquick > div { flex: 1; display: flex; flex-direction: column; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 8px 4px; }
.pfquick b { font-size: 1.1rem; font-variant-numeric: tabular-nums; } .pfquick span { font-size: 0.72rem; color: var(--muted); }
.pflangs { display: flex; flex-direction: column; gap: 8px; } .pflangs div { display: flex; justify-content: space-between; align-items: center; }
.pfskill { display: flex; flex-direction: column; gap: 6px; } .pfskill b { font-size: 0.82rem; } .pfskill .row { gap: 6px; }
.pfskill .topicchip { font-size: 0.75rem; }
.pfcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.pfsrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pfsolved .progring { position: relative; width: 120px; height: 120px; flex: none; }
.pfsolved .ringlabel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.pfsolved .ringlabel b { font-size: 1.6rem; } .pfsolved .ringlabel span, .pfsolved .ringlabel small { color: var(--muted); font-size: 0.8rem; }
.pfdiff { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 110px; }
.pfd { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; }
.pfd.d-E { background: var(--easy-soft); } .pfd.d-M { background: var(--medium-soft); } .pfd.d-H { background: var(--hard-soft); }
.pfd b { color: var(--ink); font-weight: 500; }
.pfstreak { align-items: flex-start; }
.pfflame svg { width: 34px; height: 34px; fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; }
.pfflame.on svg { fill: #F59E0B; stroke: #D97706; }
.pfbig { font-size: 1.6rem; letter-spacing: -0.02em; }
.pfstreak .pfquick { width: 100%; margin-top: auto; }
.hmwrap { overflow-x: auto; padding-bottom: 4px; }
.heatmap { display: block; max-width: none; }
.heatmap text { font-size: 9px; fill: var(--muted); }
.hm0 { fill: var(--surface-2); background: var(--surface-2); } .hm1 { fill: #BEE9CD; background: #BEE9CD; } .hm2 { fill: #7FD3A0; background: #7FD3A0; } .hm3 { fill: #2FA866; background: #2FA866; } .hm4 { fill: #00753E; background: #00753E; }
.hmlegend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
.hmlegend i { width: 11px; height: 11px; border-radius: 2.5px; }
.recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.recent li a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; text-decoration: none; }
.recent li:nth-child(odd) a { background: var(--surface-2); }
.recent li a:hover { background: var(--hover-soft); }
.rtitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; min-width: 0; }
.rmeta { display: flex; gap: 10px; align-items: center; flex: none; font-size: 0.78rem; }
@media (max-width: 1000px) { .pfgrid { grid-template-columns: 1fr; } .pfcards { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .pfcards { grid-template-columns: 1fr; } .rmeta .cotag { display: none; } }

/* Navigation bar (floating, like TensorTonic): logo, links, then progress, theme toggle and account */
.topbar .wrap { min-height: 60px; gap: 0 18px; padding-left: 20px; padding-right: 12px; }
.brand .bname { font-size: 1.12rem; font-weight: 800; letter-spacing: -0.03em; }
.navlinks button { min-height: 60px; font-size: 0.92rem; font-weight: 500; color: var(--nav-ink); padding: 0 12px; position: relative; }
.navlinks button:hover { color: var(--nav-ink-strong); }
.navlinks button[aria-current="page"] { color: var(--nav-ink-strong); font-weight: 600; }
.navlinks button[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 14px; height: 2px; border-radius: 2px; background: var(--accent); }
.topright { gap: 10px; }
.topbar .solved { font-size: 0.8rem; background: var(--surface-2); border-radius: 999px; padding: 5px 12px 5px 6px; gap: 6px; }
.topbar .solved .codecount { margin-left: 4px; padding-left: 8px; }
.navicon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: transparent; border: 1px solid transparent; color: var(--nav-ink); }
.navicon:hover { background: var(--surface-2); color: var(--nav-ink-strong); border-color: var(--line); }
.navicon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.avatar { width: 34px; height: 34px; }
.sync { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 1100px) { .topbar .solved .codecount { display: none; } }
@media (max-width: 720px) { .topbar .solved { display: none; } .navlinks button[aria-current="page"]::after { bottom: 6px; } }

/* Roadmap map: details on top, an interactive canvas below */
.rmtop { display: grid; grid-template-columns: minmax(0, 1fr) 220px minmax(0, 1.3fr); gap: 16px; align-items: stretch; }
.rmtop h3 { font-size: 1rem; }
.rmwho { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.86rem; display: flex; flex-direction: column; gap: 6px; }
.rmprogcard { align-items: center; }
.rmgauge { position: relative; width: 120px; height: 120px; margin: 0 auto; }
.rmgauge .ringlabel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.rmgauge b { font-size: 2rem; color: var(--accent); } .rmgauge span { font-size: 0.78rem; color: var(--muted); }
.center { text-align: center; }
.rmdetail h3 { font-size: 1.1rem; }
.rmprog { display: flex; align-items: center; gap: 10px; } .rmprog .rmbar { flex: 1; height: 6px; }
.rmlessons { margin: 0; padding-left: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 14px; font-size: 0.84rem; counter-reset: l; }
.rmlessons li { display: flex; gap: 8px; align-items: baseline; }
.rmlessons li::before { counter-increment: l; content: counter(l); width: 18px; height: 18px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 0.68rem; background: var(--surface-2); color: var(--muted); }
.rmlessons li.ok::before { content: "✓"; background: var(--ok); color: var(--go-ink); }
.rmdetail .row { gap: 6px; }
.topicchip.ok { background: var(--ok-soft); color: var(--ok); }
.rmboard { position: relative; border: 1px solid var(--line); border-radius: var(--radius); background-color: var(--surface); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; overflow: hidden; }
.rmtools { position: absolute; top: 12px; left: 12px; z-index: 2; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: var(--shadow-sm); }
.rmtools .iconbtn { border: 0; background: none; width: 30px; height: 30px; }
.rmtools .iconbtn:hover { background: var(--surface-2); }
.rmhint { position: absolute; top: 14px; right: 14px; z-index: 2; font-size: 0.74rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.rmscroll { position: relative; height: min(78vh, 760px); overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.rmscroll.grabbing { cursor: grabbing; }
.rminner { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.rmlines { position: absolute; inset: 0; overflow: visible; }
.rmlines path { fill: none; stroke: var(--line); stroke-width: 1.6; }
.rmlines path.lit { stroke: var(--accent-line); stroke-width: 2; }
.rmnode { position: absolute; width: 176px; height: 58px; display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 8px 12px; text-align: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
.rmnode:hover { border-color: var(--hover-line); box-shadow: var(--shadow); }
.grabbing .rmnode { cursor: grabbing; }
.rmt { font-size: 0.74rem; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rmbar { display: block; height: 3px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 9px); overflow: hidden; }
.rmbar i { display: block; height: 100%; background: var(--accent); }
.rmnode.k-c { background: color-mix(in srgb, var(--node-c) 6%, var(--surface)); border-color: color-mix(in srgb, var(--node-c) 28%, var(--line)); }
.rmnode.k-r, .rmnode.k-x { background: color-mix(in srgb, var(--node-r) 6%, var(--surface)); border-color: color-mix(in srgb, var(--node-r) 28%, var(--line)); }
.rmnode.locked { color: var(--muted); box-shadow: none; }
.rmnode.done { border-color: var(--ok); }
.rmnode.done .rmbar i { background: var(--ok); }
.rmnode.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rmnode.sel { outline: 2px solid var(--ink); outline-offset: 2px; }
.rmlegend { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface); font-size: 0.76rem; color: var(--muted); }
.rmlegend span { display: inline-flex; align-items: center; gap: 6px; }
.rmzoom { margin-left: auto; }
.lg { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); }
.lg.c { border-color: color-mix(in srgb, var(--node-c) 40%, var(--line)); background: color-mix(in srgb, var(--node-c) 10%, var(--surface)); }
.lg.r { border-color: color-mix(in srgb, var(--node-r) 40%, var(--line)); background: color-mix(in srgb, var(--node-r) 10%, var(--surface)); }
.lg.done { border-color: var(--ok); background: var(--ok-soft); }
.stagesh { margin-top: 18px; }
@media (max-width: 1100px) { .rmtop { grid-template-columns: 1fr 200px; } .rmdetail { grid-column: 1 / -1; } }
@media (max-width: 640px) { .rmtop { grid-template-columns: 1fr; } .rmscroll { height: 62vh; } .rmhint { display: none; } }

/* Dark mode: the tokens switch in :root[data-theme="dark"]; these are the few hand-picked light colors */
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="dark"] ::selection { background: #15301F; color: #ECEFE8; }
:root[data-theme="dark"] .topbar { background: color-mix(in srgb, var(--bg) 82%, transparent); }
:root[data-theme="dark"] .hcos button { color: #6F766B; } :root[data-theme="dark"] .hcos button:hover { color: var(--ink); }
:root[data-theme="dark"] .htopic.t0 .hart { background: #18202B; } :root[data-theme="dark"] .htopic.t1 .hart { background: #15241B; } :root[data-theme="dark"] .htopic.t2 .hart { background: #2A2416; }
:root[data-theme="dark"] .htopic.t3 .hart { background: #142624; } :root[data-theme="dark"] .htopic.t4 .hart { background: #2A2614; } :root[data-theme="dark"] .htopic.t5 .hart { background: #1E2126; }
:root[data-theme="dark"] .art { stroke: #CFD6CB; } :root[data-theme="dark"] .art text { fill: #CFD6CB; } :root[data-theme="dark"] .art-gpu rect { fill: rgba(95, 211, 141, 0.12); }
:root[data-theme="dark"] .hcta { background: radial-gradient(90% 120% at 100% 100%, rgba(95, 211, 141, 0.14), transparent 60%), linear-gradient(180deg, #121A14, #0F120F); }
:root[data-theme="dark"] .hcard { box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }
:root[data-theme="dark"] .hm1 { fill: #1B4A2E; background: #1B4A2E; } :root[data-theme="dark"] .hm2 { fill: #24733F; background: #24733F; } :root[data-theme="dark"] .hm3 { fill: #3BA562; background: #3BA562; } :root[data-theme="dark"] .hm4 { fill: #5FD38D; background: #5FD38D; }
:root[data-theme="dark"] .coav, :root[data-theme="dark"] .pfav { background: #ECEFE8; color: #0F120F; }
:root[data-theme="dark"] .bit.on { background: #ECEFE8; color: #0F120F; }
:root[data-theme="dark"] #authpage { background: var(--bg); }
.stagesh { margin-top: 8px; } .rmintro { margin-top: -10px; }

/* Privacy page and the destructive button */
.privgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.privlist { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #FFFFFF; }
@media (max-width: 800px) { .privgrid { grid-template-columns: 1fr; } }

/* Admin dashboard */
.admstats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.admstats .card { gap: 2px; padding: 16px; }
.admstats b { font-size: 1.7rem; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.admstats span { font-size: 0.75rem; color: var(--muted); }
.dau { display: grid; grid-template-columns: repeat(30, 1fr); gap: 4px; align-items: end; height: 120px; }
.dau div { height: 100%; display: flex; align-items: flex-end; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.dau i { display: block; width: 100%; background: var(--accent); border-radius: 4px; min-height: 0; }
.admtable { table-layout: auto; }
.admtable td, .admtable th { white-space: nowrap; }
.thsort { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.thsort.on { color: var(--ink); font-weight: 600; }
.admbars { display: flex; flex-direction: column; gap: 10px; }
.admbars > div { display: grid; grid-template-columns: 170px 1fr 120px; gap: 10px; align-items: center; font-size: 0.85rem; }
.admbars .bar { height: 8px; border-radius: 999px; background: var(--bad-soft); overflow: hidden; }
.admbars .bar b { display: block; height: 100%; background: var(--ok); }
@media (max-width: 900px) { .admstats { grid-template-columns: repeat(3, 1fr); } .admbars > div { grid-template-columns: 1fr; } }

/* Light theme details from the poster: mono labels, hairline rules, black call-to-action buttons */
:root:not([data-theme="dark"]) .card, :root:not([data-theme="dark"]) .tablewrap, :root:not([data-theme="dark"]) .panel { border-color: var(--line); }
:root:not([data-theme="dark"]) .pagehead, :root:not([data-theme="dark"]) .hsub { border-color: #161616; }
:root:not([data-theme="dark"]) .hcta { border-color: var(--accent-line); }
:root:not([data-theme="dark"]) .tag.t-run, :root:not([data-theme="dark"]) .cotag.rep { background: var(--accent-soft); color: var(--accent-hover); border-color: transparent; }
:root:not([data-theme="dark"]) .acctbtn { background: #161616; border-color: #161616; color: #F7F5F0; box-shadow: none; }
:root:not([data-theme="dark"]) .acctbtn:hover { background: #393939; border-color: #393939; }
:root:not([data-theme="dark"]) .btn.primary, :root:not([data-theme="dark"]) .btn.go { box-shadow: none; }
:root:not([data-theme="dark"]) .btn.primary:hover, :root:not([data-theme="dark"]) .btn.go:hover { background: #393939; border-color: #393939; }
:root:not([data-theme="dark"]) .tchip.on { background: #161616; color: #F7F5F0; border-color: #161616; }
:root:not([data-theme="dark"]) .qst.cur { background: var(--accent); color: #FFFFFF; }
:root:not([data-theme="dark"]) .hpi { background: var(--accent-soft); color: var(--accent); }
h1, h2, h3, .hh2 { letter-spacing: -0.02em; }


/* Top bar: full width, flat, no border or rounded corners (LeetCode style) */
.topbar { padding: env(safe-area-inset-top, 0px) 0 0; background: var(--nav-bg); backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 0; box-shadow: none; }
:root[data-theme="dark"] .topbar { background: var(--nav-bg); }
.topbar .wrap, .topbar .wrap.wide { max-width: none; border: 0; border-radius: 0; box-shadow: none; background: transparent; min-height: 52px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.navlinks button { min-height: 52px; }
.navlinks button[aria-current="page"]::after { bottom: 0; height: 2px; border-radius: 0; }
@media (max-width: 720px) { .topbar { padding-left: 0; padding-right: 0; } .topbar .wrap { padding-left: 14px; padding-right: 10px; } .navlinks button[aria-current="page"]::after { bottom: 0; } }

/* Online assessment */
.oagrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.oastart .row { margin-top: 4px; }
.oaneg { display: flex; gap: 10px; align-items: flex-start; font-size: 0.88rem; color: var(--muted); }
.oaneg input { margin-top: 3px; accent-color: var(--accent); }
.oapool { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.oapool > div { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; background: var(--surface-2); opacity: .6; }
.oapool > div.ready { opacity: 1; background: var(--accent-soft); }
.oapool .coav { width: 28px; height: 28px; font-size: 0.65rem; border-radius: 8px; }
.oapool span { font-size: 0.82rem; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oapool em { font-style: normal; font-size: 0.68rem; font-family: var(--font-mono); color: var(--muted); }
.oapool .ready em { color: var(--accent); }
.oabar { position: sticky; top: 60px; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.oabar > div:first-child { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
.oatime { display: inline-flex; align-items: center; gap: 8px; font: 600 1.15rem var(--font-mono); padding: 6px 14px; border-radius: 999px; background: var(--surface-2); }
.oatime svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
#oatimer.low { color: var(--bad); }
.oaconfirm { display: inline-flex; align-items: center; gap: 8px; font-size: 0.86rem; }
.oaexam { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.oaside { position: sticky; top: 132px; gap: 10px; }
.oanums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.oanums button { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: 500 0.82rem var(--font-mono); cursor: pointer; position: relative; }
.oanums button.done { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.oanums button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); }
.oanums button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.oalegend { display: flex; gap: 12px; } .oalegend span { display: inline-flex; gap: 6px; align-items: center; }
.lg.flag { background: var(--pink); border-color: var(--pink); border-radius: 50%; }
.oalegend .lg.done { background: var(--ink); border-color: var(--ink); }
.oaq { gap: 14px; min-height: 420px; }
.oanavrow { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.btn.ghost.on { color: var(--pink); }
.oaeditor { width: 100%; min-height: 320px; font: 0.86rem/1.6 var(--font-mono); background: var(--editor-bg); color: var(--editor-ink); border: 0; border-radius: 10px; padding: 14px; resize: vertical; white-space: pre; tab-size: 4; caret-color: #FFFFFF; }

/* Logos in place of company names: tiny in table rows, small as chips, medium on the home page */
.coav.xs { width: 22px; height: 22px; font-size: 0.55rem; } .coav.xs.logo { padding: 3px; } .coav.xs.logo.wide { width: 40px; padding: 3px 4px; }

/* ---------- Positions: logo-tile cards, like a jobs board ---------- */

<script>
// Question bank for the Ground Up Hardware Trainer.
// Entry: [id, difficulty, question, answer, explanation, tags?]
//   difficulty: E (easy), M (medium), H (hard)
//   answer: [correct, distractor, distractor, distractor] for multiple choice, or true/false
//   tags: o = from your OA, v = variant of an OA question, r = reported online,
//         b = beyond the book (the explanation teaches it), a = computer arithmetic
// The id prefix is the chapter of "Hardware from the Ground Up" that teaches the topic.
const RAW = [
// 1 Electricity
["01-01","E","A 1 kΩ resistor is connected across a 5 V supply. What current flows?",["5 mA","0.2 mA","5 A","50 mA"],"Ohm's law: I = V/R = 5 V / 1000 Ω = 5 mA."],
["01-02","M","Three 300 Ω resistors are connected in parallel. What is the total resistance?",["100 Ω","900 Ω","300 Ω","150 Ω"],"Equal resistors in parallel give R/n = 300/3 = 100 Ω. Parallel resistance is always below the smallest resistor."],
["01-03","E","Two resistors are connected in series. What do they always share?",["The same current","The same voltage","The same power","Nothing; it depends on their values"],"Series parts sit on one path, so the same current flows through each, and their voltages add."],
["01-04","M","A voltage divider has Vin = 3.3 V, R1 = 10 kΩ on top and R2 = 20 kΩ on the bottom. What is Vout across R2?",["2.2 V","1.1 V","1.65 V","3.3 V"],"Vout = Vin × R2/(R1 + R2) = 3.3 × 20/30 = 2.2 V."],
["01-05","E","A 10 Ω resistor carries 2 A. How much power does it dissipate?",["40 W","20 W","5 W","200 W"],"P = I²R = 4 × 10 = 40 W."],
["01-06","E","Voltage is always measured between two points.",true,"Voltage is a difference in energy per charge between two points. A node voltage is measured relative to ground."],
["01-07","M","Board A sends a digital signal to board B over a single wire and nothing else. Board B reads random values. What is the most likely cause?",["The boards share no ground, so B has no reference and the current has no return path","The wire is too short for the signal to settle, so B samples it before it arrives","Board B's clock is too fast, so it samples each bit several times","The signal voltage is too high, so B's input clamps and reads noise"],"The sender's 1 is defined relative to the sender's ground. Without a shared ground there is no common reference and no return path.","r"],
["01-08","E","A CMOS logic input left unconnected (floating) reliably reads as 0.",false,"A floating input has an undefined voltage that drifts with noise, so it can read as 0 or 1. Tie it to a level, or use a pull-up or pull-down resistor."],
["01-09","M","What does a pull-up resistor do on an input that a push button connects to ground?",["Holds the input at 1 when open, and limits current when pressed","Speeds up the input's switching by adding a current path to VDD","Amplifies the button signal so the input sees a full logic level","Protects the button contacts from static discharge when pressed"],"Open: no current flows, so the input sits at VDD. Pressed: the input connects to ground, and the resistor limits the current."],
["01-10","M","A wire is made twice as long and given twice the cross-sectional area. Its resistance:",["Stays the same","Doubles","Halves","Quadruples"],"R = ρL/A. Doubling L doubles R, doubling A halves it, and the effects cancel."],
["01-11","M","A 1.00 V regulator feeds a chip drawing 200 A through 0.25 mΩ of path resistance. What voltage reaches the chip?",["0.95 V","0.75 V","1.00 V","0.995 V"],"IR drop = 200 × 0.00025 = 0.05 V, so the chip sees 1.00 − 0.05 = 0.95 V."],
["01-12","E","An ammeter is connected in parallel with the component whose current it measures.",false,"An ammeter goes in series, because the current must flow through it. A low-resistance ammeter placed in parallel creates a short."],
["01-13","E","What is the period of a 2 GHz clock?",["0.5 ns","2 ns","5 ns","0.2 ns"],"T = 1/f = 1/(2 × 10⁹) = 0.5 ns."],
["01-14","E","A GPU runs at 0.9 V and draws 400 A. What is its power?",["360 W","444 W","400 W","36 W"],"P = VI = 0.9 × 400 = 360 W, and all of it becomes heat."],
["01-15","E","Kirchhoff's current law says the current flowing into a node equals the current flowing out.",true,"Charge does not pile up at a junction."],
["01-16","M","Two 1 kΩ resistors in series are placed in parallel with a 2 kΩ resistor. The total resistance is:",["1 kΩ","4 kΩ","667 Ω","2 kΩ"],"The series pair is 2 kΩ, and 2 kΩ in parallel with 2 kΩ is 1 kΩ."],
["01-17","M","A 5 V source with 1 Ω of internal resistance drives a 4 Ω load. The voltage across the load is:",["4 V","5 V","1 V","2.5 V"],"The current is 5/(1 + 4) = 1 A, so the load sees 4 V and 1 V is lost inside the source."],
["01-18","E","Kirchhoff's voltage law says that around any closed loop:",["The voltage rises and drops sum to zero","The currents entering and leaving sum to zero","The resistances along the loop sum to zero","The power delivered around the loop stays constant"],"Energy per charge is conserved around a loop."],
["01-19","H","64 output pins switch at once, each pushing a 20 mA step in 1 ns through a shared ground connection with 0.5 nH of inductance. About how much does the chip's internal ground bounce?",["0.64 V","0.01 V","1.28 V","0.32 V"],"The total di/dt is 64 × 20 mA / 1 ns = 1.28 A/ns, and V = L·di/dt = 0.5 nH × 1.28 A/ns = 0.64 V. This is simultaneous switching noise; more ground pins and decoupling reduce it.","r"],
["01-20","M","At high frequency, the return current of a signal on a circuit board flows mainly:",["In the ground plane directly underneath the signal trace, where the loop inductance is smallest","Along the shortest straight line from the load back to the source","Through whichever path has the lowest DC resistance, wherever it lies","Spread evenly across the whole ground plane, regardless of the trace"],"Current returns where the loop area is smallest. A gap in the plane under a trace forces a large loop and causes noise.","r"],
["01-21","E","A 3.3 V output drives an LED through a 220 Ω resistor, and the LED drops 2.0 V. The current is about:",["5.9 mA","15 mA","9.1 mA","2.0 mA"],"(3.3 − 2.0)/220 ≈ 5.9 mA."],
// 2 Capacitors, inductors and signals
["02-01","M","A transistor that acts like a 2 kΩ resistor drives a 50 fF load. About how long until the load reaches 50% of its final voltage?",["69 ps","100 ps","35 ps","220 ps"],"τ = RC = 100 ps, and 50% is reached at 0.69τ ≈ 69 ps."],
["02-02","E","The voltage across a capacitor can change instantly.",false,"I = C·dV/dt, so an instant change would need infinite current. Capacitor voltage always changes smoothly."],
["02-03","E","If the voltage on a capacitor doubles, the energy it stores:",["Quadruples","Doubles","Stays the same","Halves"],"E = ½CV², so energy scales with V²."],
["02-04","E","Two 1 µF capacitors connected in series give:",["0.5 µF","2 µF","1 µF","0.25 µF"],"Series capacitors combine like parallel resistors: (1 × 1)/(1 + 1) = 0.5 µF. Parallel capacitors add."],
["02-05","M","The current through a 1 nH inductance changes by 2 A in 1 ns. What voltage appears across it?",["2 V","0.5 V","2 mV","20 V"],"V = L·dI/dt = 10⁻⁹ × 2/10⁻⁹ = 2 V."],
["02-06","H","Which best supplies a chip's power pins during a current step that lasts a few nanoseconds?",["A small, low-inductance capacitor placed right at the pins","A 100 µF capacitor 10 cm away","No capacitor; the regulator responds instantly","An inductor in series with the pins"],"Fast current steps are limited by path inductance. A small capacitor at the pins has the least; a large capacitor far away cannot deliver its charge quickly.","r"],
["02-07","M","Why do boards still use large bulk capacitors alongside small ones?",["They store more charge for slower, longer current changes","They respond faster than small capacitors","They lower the clock frequency","They block DC from the chip"],"Decoupling is a ladder: bulk capacitors for slow changes, small ceramics for faster ones, on-package and on-die capacitance for the fastest."],
["02-08","H","A 50 Ω transmission line ends in a 25 Ω load. The reflection coefficient is:",["−1/3","+1/3","−1/2","0"],"Γ = (ZL − Z0)/(ZL + Z0) = (25 − 50)/75 = −1/3: a third of the step reflects, inverted."],
["02-09","M","A transmission line is left open at its far end. The reflection is:",["Complete, with the same polarity (Γ = +1)","Complete and inverted (Γ = −1)","Zero","Half, and inverted"],"ZL = ∞ gives Γ = +1. A short gives −1 and a matched load gives 0."],
["02-10","E","Terminating a line with a load equal to its characteristic impedance eliminates the reflection.",true,"ZL = Z0 makes Γ = 0."],
["02-11","H","A 100 MHz square wave looks like a sine wave on a 150 MHz oscilloscope. Why?",["The scope filters out the 3rd and higher harmonics, leaving only the fundamental","The probe adds a DC offset that rounds off the corners of the wave","The scope's sample rate is too high, so it smooths the edges","The signal generator distorts square waves above 100 MHz"],"A square wave is a fundamental plus odd harmonics (300 MHz, 500 MHz, ...). Above the scope's bandwidth they are filtered out."],
["02-12","M","About what rise time can a 350 MHz oscilloscope show?",["1 ns","0.35 ns","3.5 ns","10 ns"],"t_rise ≈ 0.35/bandwidth = 0.35/350 MHz = 1 ns."],
["02-13","E","With a steady DC voltage across it, a capacitor behaves like:",["An open circuit","A short circuit","A resistor","An inductor"],"Once charged, no current flows into it. Its reactance 1/(2πfC) is infinite at f = 0."],
["02-14","M","For an RC circuit, the 10% to 90% rise time is about:",["2.2 RC","0.69 RC","1 RC","5 RC"],"0.69RC is the 50% point, RC is 63%, and about 5RC is fully settled."],
["02-15","E","Every on-chip wire and every transistor gate acts as a capacitor.",true,"Conductors separated by insulation form capacitors, which is why switching costs time and energy."],
["02-16","H","A decoupling capacitor has C = 100 nF and a series inductance (ESL) of 1 nH. Above roughly what frequency does it stop behaving like a capacitor?",["About 16 MHz, its self-resonant frequency","About 1.6 GHz","About 160 kHz","It always behaves like a capacitor"],"f = 1/(2π√(LC)) = 1/(2π√(10⁻⁹ × 10⁻⁷)) ≈ 16 MHz. Above it the inductance dominates, which is why smaller, lower-ESL capacitors are added for higher frequencies.","r"],
["02-17","M","Placing a decoupling capacitor farther from the power pins mainly hurts it by:",["Adding loop inductance between the capacitor and the pins","Reducing its capacitance, since long traces discharge it","Raising its ESR so it can no longer store charge","Raising the chip's clock frequency through extra coupling"],"The extra trace and via length adds inductance, which limits how fast the capacitor can deliver current.","r"],
["02-18","H","A 10 fF capacitor charged to 1 V is connected to an uncharged 30 fF capacitor. The final shared voltage is:",["0.25 V","0.5 V","0.75 V","0.33 V"],"Charge is conserved: 10 fC spread over 40 fF gives 0.25 V. Charge sharing like this limits DRAM reads and troubles dynamic logic."],
["02-19","M","A signal travels about 15 cm per ns on a circuit board. A trace needs transmission-line treatment when its delay exceeds about a sixth of the rise time. For a 0.6 ns rise time, the critical length is about:",["1.5 cm","15 cm","9 cm","0.15 cm"],"A sixth of 0.6 ns is 0.1 ns, and 0.1 ns × 15 cm/ns = 1.5 cm. Longer traces need controlled impedance and termination."],
["02-20","M","A driver with 10 Ω of output resistance drives a 50 Ω line. A series termination resistor at the driver should be about:",["40 Ω","50 Ω","10 Ω","60 Ω"],"The driver plus the resistor should equal Z0: 10 + 40 = 50 Ω. The reflection from the open far end is then absorbed at the source."],
["02-21","E","An inductor opposes:",["Changes in current","Changes in voltage","Steady DC current","Any current at all"],"V = L·di/dt. A constant current produces no voltage, and a fast change produces a large one."],
["02-22","M","The equivalent series resistance (ESR) of a decoupling capacitor:",["Causes an I·ESR voltage drop during current steps, but also damps resonance","Increases its effective capacitance at high frequency","Has no effect, because it is in series with a capacitor","Lets it store more energy, at the cost of slower charging"],"A little ESR helps damp ringing between capacitors; too much weakens the decoupling."],
["02-23","E","Capacitors connected in parallel:",["Add their capacitances","Combine like parallel resistors","Keep only the largest value","Cancel out"],"C_total = C1 + C2 + … Series capacitors combine like parallel resistors."],
// 3 Heat
["03-01","M","A 250 W chip has 0.2 °C/W of total thermal resistance to 25 °C air. What is its junction temperature?",["75 °C","50 °C","125 °C","62.5 °C"],"Tj = 25 + 250 × 0.2 = 75 °C."],
["03-02","H","A 400 W chip must stay below 95 °C in 40 °C air. What is the maximum total thermal resistance?",["0.1375 °C/W","0.2375 °C/W","0.1 °C/W","7.3 °C/W"],"(95 − 40)/400 = 0.1375 °C/W."],
["03-03","M","Why do many heat sinks combine a copper base with aluminum fins?",["Copper conducts better where heat is concentrated; aluminum is lighter and cheaper for the large fin area","Aluminum conducts heat better than copper, so it goes where heat spreads out","Copper cannot be extruded into thin fins, so aluminum is the only option","The two metals form a thermocouple that pumps heat away from the chip"],"Copper conducts about twice as well as aluminum, but it is about 3.3× denser and costs more.","r"],
["03-04","E","The main purpose of a heat sink's fins is to:",["Increase the surface area for convection","Store heat during bursts and release it later","Insulate the chip from the hot air around it","Raise the thermal resistance so the chip heats evenly"],"Convection grows with area, and a fan forces air across the fins.","r"],
["03-05","E","Adding fins to a heat sink increases its sink-to-air thermal resistance.",false,"More fin area lowers the thermal resistance, until the fins are packed too tightly for air to flow.","r"],
["03-06","M","A thicker layer of thermal paste always improves cooling.",false,"Paste conducts far worse than metal. It should only fill the microscopic air gaps; extra thickness adds resistance."],
["03-07","E","A heat pipe moves heat mainly by:",["Evaporation at the hot end and condensation at the cold end","A small internal pump pushing water from end to end","Radiation from the hot end to the cold end inside the pipe","Electrical current that carries heat along the copper"],"Phase change gives an effective conductivity far above solid copper.","r"],
["03-08","M","Per unit volume and per degree, how much heat does water carry compared with air?",["Thousands of times more","About the same","About 4 times more","Less"],"Water has about 4× the specific heat of air and is about 800× denser."],
["03-09","E","Thermal resistances along the path junction → case → sink → air combine by:",["Adding in series","Combining like parallel resistors","Multiplying","Taking the largest one"],"Heat flows through each layer in turn, so the resistances add."],
["03-10","M","Thermal runaway happens because:",["Higher temperature raises leakage power, which raises the temperature further","Fans spin faster when hot, which draws more power and heat","Copper softens as it heats, raising its thermal resistance","Clock frequency rises automatically with temperature"],"Leakage grows exponentially with temperature. If cooling cannot keep up, the loop escalates."],
["03-11","H","To throttle, firmware lowers voltage by 10% and frequency by 10%. Dynamic power falls by about:",["27%","10%","20%","50%"],"P ∝ V²f: 0.9² × 0.9 = 0.729, about a 27% reduction.","v"],
["03-12","E","How does a heat sink hand its heat to the surrounding air?",["Convection","Conduction only","Radiation only","Evaporation"],"Conduction carries heat through the metal; convection hands it to moving air. Radiation is minor at chip temperatures."],
["03-13","E","In steady operation, essentially all the electrical power a chip consumes becomes heat.",true,"The chip stores almost no energy, so power in equals heat out."],
["03-14","M","A chip's heat path is 0.1 °C/W junction-to-case, 0.05 °C/W through the paste and 0.15 °C/W sink-to-air. At 200 W in 30 °C air, the junction is at:",["90 °C","60 °C","30 °C","120 °C"],"The total is 0.3 °C/W, giving a 60 °C rise above the 30 °C air."],
["03-15","M","Why does a chip's hotspot run hotter than its average temperature?",["Power density is uneven, and heat spreads sideways only so fast","The package reflects heat back onto the center of the die","Fans cool only the edges of the die, never the middle","The sensors sit in the hottest spot, so the average is guessed"],"A dense block, such as a tensor-core array, can run far hotter than the die average. Heat spreaders and careful floorplanning help."],
["03-16","E","A fan mainly lowers which thermal resistance?",["Sink-to-air","Junction-to-case","Die-to-package","Thermal paste"],"Moving air across the fins speeds up convection.","r"],
["03-17","H","Assume leakage power doubles for every 10 °C rise. A chip leaks 20 W at 60 °C. About how much does it leak at 90 °C?",["160 W","60 W","80 W","40 W"],"Three 10 °C steps: 20 × 2³ = 160 W. This feedback is what drives thermal runaway."],
["03-18","M","High-end GPUs often use liquid cold plates because:",["Water carries heat away far more effectively than air","Water is a perfect electrical insulator","Air cannot touch metal","They make the card lighter"],"Water's higher heat capacity and density let a cold plate remove kilowatts in a small space.","r"],
// 4 Semiconductors
["04-01","E","Which dopant makes n-type silicon?",["Phosphorus (5 valence electrons)","Boron (3 valence electrons)","Germanium","Oxygen"],"The fifth electron has no bond partner and is easily freed."],
["04-02","E","The majority carriers in p-type silicon are:",["Holes","Electrons","Protons","Ions"],"Boron leaves an incomplete bond, a hole, which acts as a positive carrier."],
["04-03","M","How does electron mobility in silicon compare with hole mobility?",["Electrons are about 2–3× more mobile","Holes are about 2–3× more mobile","They are equal","Holes cannot move"],"About 1400 versus 450 cm²/V·s, which is why PMOS is weaker than NMOS of the same size."],
["04-04","M","As temperature rises, carrier mobility in silicon:",["Decreases","Increases","Stays constant","Drops to zero"],"A hotter lattice vibrates more (phonons), so carriers scatter more often and drift more slowly.","o"],
["04-05","M","As temperature rises, the resistance of a copper wire:",["Increases","Decreases","Stays constant","Drops to zero"],"Metal electrons are scattered by lattice vibrations too. Copper rises about 0.4% per °C.","o"],
["04-06","M","Why does mobility fall when silicon gets hotter?",["More phonon (lattice vibration) scattering","Fewer free carriers exist at high temperature","The band gap widens, slowing carriers down","Dopant atoms evaporate out of the lattice"],"Carriers collide with vibrating atoms more often and cannot build up speed.","v"],
["04-07","E","A hole is a positively charged particle, like a proton, moving through the crystal.",false,"A hole is a missing electron in a bond. Neighbouring electrons hop into it, so the vacancy moves like a positive charge."],
["04-08","E","A silicon diode starts conducting strongly in forward bias at about:",["0.6–0.7 V","0.026 V","3.3 V","0.1 V"],"Current rises exponentially once the built-in barrier is overcome."],
["04-09","M","A reverse-biased PN junction conducts:",["Only a tiny leakage current, until breakdown","Heavily, as soon as any reverse voltage is applied","Exactly like a resistor, in proportion to the voltage","As much as in forward bias, but in the other direction"],"The depletion region widens and blocks current."],
["04-10","H","Why is the p-type body under NMOS transistors tied to ground?",["To keep the source/drain-to-body junctions reverse biased","To make the transistor faster by lowering its threshold","To store charge that keeps the transistor on","To reduce gate capacitance by removing the channel"],"Holding the body at the lowest voltage keeps its PN junctions from forward biasing."],
["04-11","M","How does transistor leakage change in hot silicon?",["It rises steeply","It falls","It stays the same","It reverses direction"],"More carriers are generated by heat and thresholds drop, so off-current grows rapidly."],
["04-12","M","The thermal voltage kT/q at room temperature is about:",["26 mV","0.7 V","1.12 V","260 mV"],"It appears in the diode equation and in subthreshold leakage."],
["04-13","E","Pure (undoped) silicon is a good conductor at room temperature.",false,"Fewer than one atom in a trillion has a freed electron, so it conducts poorly. Doping makes it useful."],
["04-14","M","As temperature rises, the number of thermally generated (intrinsic) carriers in silicon:",["Increases exponentially","Decreases, as the lattice traps them","Stays constant, set by the doping","Drops toward zero as atoms vibrate"],"More thermal energy breaks more bonds. This is one reason leakage and junction currents rise quickly when hot.","v"],
["04-15","H","Copper's resistance rises with temperature. The resistance of pure (intrinsic) silicon:",["Falls, because far more carriers are generated","Also rises, for the same scattering reason","Stays the same, since it has no dopants","Becomes infinite, since no carriers remain"],"In a metal the number of carriers is fixed and extra scattering wins. In intrinsic silicon the carrier count grows exponentially and outweighs the mobility loss.","v"],
["04-16","M","At a constant current, a silicon diode's forward voltage changes with temperature by about:",["−2 mV per °C (it falls)","+2 mV per °C","+0.4% per °C","It does not change"],"This negative temperature coefficient is used in on-chip temperature sensors."],
["04-17","M","Heavier doping makes carrier mobility:",["Lower, because carriers scatter off more ionized dopant atoms","Higher, because more carriers share the current","Unchanged, since mobility depends only on temperature","Zero, because the dopants trap every carrier"],"Impurity scattering adds to lattice (phonon) scattering."],
["04-18","H","In a very strong electric field, carrier drift velocity:",["Saturates at a maximum value","Keeps rising in proportion to the field","Falls to zero","Reverses direction"],"This is velocity saturation. It is why short-channel transistors deliver less current than the square law predicts."],
["04-19","M","The band gap of silicon is about:",["1.12 eV","0.026 eV","3.4 eV","0.7 eV"],"It is the energy needed to free an electron from a bond, and it shrinks slightly as temperature rises."],
["04-20","E","When silicon gets hotter, the loss of mobility affects:",["Both electrons and holes, so both NMOS and PMOS get weaker","Only electrons, so only NMOS gets weaker","Only holes, so only PMOS gets weaker","Neither carrier; only the wires get slower"],"Phonon scattering affects every carrier.","v"],
["04-21","M","At a nominal (high) supply voltage, how does a CMOS chip respond to rising temperature?",["Transistors drive less current and wires gain resistance, so it gets slower","Transistors speed up while wires slow down, so it barely changes","Both transistors and wires speed up, so it gets faster","Nothing changes until the chip reaches its thermal limit"],"Mobility loss dominates when the overdrive is large, and wire resistance always rises.","v"],
// 5 MOSFETs
["05-01","E","An NMOS transistor turns on when:",["VGS > Vtn (gate high relative to the source)","VGS < 0","The drain is grounded","Gate current exceeds a threshold"],"A positive gate attracts electrons and forms an inversion channel."],
["05-02","M","A PMOS has its source at 1.0 V, its gate at 0 V, and |Vtp| = 0.3 V. It is:",["On","Off","Reverse biased","Broken down"],"VSG = 1.0 V > 0.3 V. A PMOS turns on when its gate is pulled below its source."],
["05-03","M","An NMOS pass transistor with its gate at VDD = 1.2 V (Vtn = 0.4 V) passes a logic 1. The output reaches:",["0.8 V","1.2 V","0.4 V","1.6 V"],"NMOS passes a weak 1: VDD − Vtn = 0.8 V.","v"],
["05-04","M","A PMOS pass transistor with its gate at 0 V (|Vtp| = 0.35 V) passes a logic 0. The output falls to:",["0.35 V","0 V","−0.35 V","0.65 V"],"PMOS passes a weak 0, stopping at |Vtp|.","v"],
["05-05","E","An NMOS transistor passes a ___ 0 and a ___ 1.",["strong; weak","weak; strong","strong; strong","weak; weak"],"NMOS is good at pulling down and PMOS is good at pulling up.","v"],
["05-06","H","Why does an NMOS pass only a weak 1?",["The output is its source, so VGS shrinks as it rises until it turns off","Electrons cannot carry a logic 1; only holes can","The gate oxide leaks charge away from the output node","The body effect pushes Vt to zero as the output rises"],"When passing a 1, the lower-voltage end (the output) is the source, so VGS = VDD − Vout.","v"],
["05-07","H","Two NMOS pass transistors are in series with both gates at VDD = 1 V, Vt = 0.3 V, and a 1 V input. The output is:",["0.7 V","0.4 V","1.0 V","0.1 V"],"With both gates at the full supply, the threshold drop happens only once.","r"],
["05-08","H","An NMOS whose gate is driven by a 0.7 V node passes a 1.0 V input (Vt = 0.3 V). The output is:",["0.4 V","0.7 V","1.0 V","0.3 V"],"Vout = min(Vin, VG − Vt) = min(1.0, 0.4) = 0.4 V. Drops pile up when degraded nodes drive gates.","r"],
["05-09","H","VDD = 5 V and Vt = 2 V. A 4 V input passes through an NMOS whose gate is at 5 V. The output node reaches:",["3 V","4 V","2 V","5 V"],"min(4, 5 − 2) = 3 V: the gate limits it, not the input.","r"],
["05-10","M","In saturation, which change doubles an NMOS's drain current?",["Doubling the width W","Doubling the length L","Doubling the overdrive VGS − Vt","Doubling Vt"],"I ∝ (W/L)(VGS − Vt)². Doubling W doubles I, doubling L halves it, and doubling the overdrive quadruples it."],
["05-11","M","Under the square law, doubling the overdrive (VGS − Vt) multiplies the saturation current by:",["4","2","√2","8"],"I ∝ (VGS − Vt)²."],
["05-12","M","If μn = 2.5 μp and an NMOS is 1 μm wide, how wide should a same-length PMOS be for equal current?",["2.5 μm","1 μm","0.4 μm","5 μm"],"(W/L)p/(W/L)n = μn/μp."],
["05-13","E","A MOSFET's gate draws a steady DC current while the transistor is on.",false,"The gate sits on an insulating oxide, so current flows only while its capacitance charges or discharges."],
["05-14","M","Lowering a transistor's threshold voltage makes it:",["Faster but exponentially leakier","Slower but much less leaky","Faster and also less leaky","Slower and also leakier"],"More overdrive gives more current, but subthreshold leakage grows exponentially as Vt falls."],
["05-15","M","The body effect means that when the source rises above the body, the threshold voltage:",["Increases","Decreases","Becomes zero","Changes sign"],"It makes a passed 1 even weaker and slows the upper transistors in a stack."],
["05-16","M","Why did the industry move to FinFET and gate-all-around transistors?",["Wrapping the gate around the channel gives better control and less leakage","They need no gate oxide, which removes gate leakage","They conduct with holes only, which balances NMOS and PMOS","They are cheaper to make per wafer than planar transistors"],"At very short channel lengths, a gate sitting only on top could no longer turn the channel fully off."],
["05-17","H","μCox = 200 μA/V², W/L = 4, Vt = 0.4 V and VGS = 1.0 V, in saturation. What is ID?",["144 μA","288 μA","72 μA","480 μA"],"½ × 200 μ × 4 × 0.6² = 144 μA."],
["05-18","H","VDD = 5 V and Vt = 2 V for every NMOS. M1 has its gate at 5 V and passes a 5 V input to node X. Node X drives the gate of M2, which passes a 5 V input to node Y. What are X and Y?",["X = 3 V, Y = 1 V","X = 3 V, Y = 3 V","X = 5 V, Y = 5 V","X = 3 V, Y = 0 V"],"X = min(5, 5 − 2) = 3 V. M2's gate is only 3 V, so Y = min(5, 3 − 2) = 1 V. Each degraded node driving a gate costs another threshold.","r"],
["05-19","M","VDD = 5 V and Vt = 2 V. An NMOS with its gate at 5 V passes a 1 V input. The output is:",["1 V","3 V","0 V","2 V"],"min(1, 5 − 2) = 1 V. Low inputs pass intact; only high inputs are clipped at VG − Vt.","r"],
["05-20","M","VDD = 5 V and Vt = 2 V. An NMOS has its gate driven by a node at 1.5 V. It:",["Stays off; its gate is below Vt","Passes 1.5 V to its output","Passes 3 V to its output","Passes 0.5 V to its output"],"VGS can be at most 1.5 V, under the 2 V threshold, so no channel forms and the output floats.","r"],
["05-21","M","An NMOS has VGS = 1.0 V, Vt = 0.4 V and VDS = 0.3 V. It is in the:",["Linear (triode) region","Saturation region","Cutoff region","Breakdown region"],"Saturation needs VDS ≥ VGS − Vt = 0.6 V. With 0.3 V it is in the linear region."],
["05-22","M","An NMOS has VGS = 0.8 V, Vt = 0.4 V and VDS = 1.0 V. It is in:",["Saturation","The linear (triode) region","Cutoff","Breakdown"],"VDS = 1.0 V ≥ VGS − Vt = 0.4 V, so the channel is pinched off at the drain."],
["05-23","H","At room temperature, subthreshold leakage changes by about 10× for every ___ change in threshold voltage.",["60–100 mV","1–5 mV","300–500 mV","1–2 V"],"The ideal subthreshold swing is about 60 mV per decade at 300 K; real devices are 70–100 mV. Lowering Vt by 100 mV can raise leakage about 10×.","b"],
["05-24","H","DIBL (drain-induced barrier lowering) means that a higher drain voltage:",["Lowers the threshold of a short-channel transistor, raising its leakage","Raises the threshold voltage, cutting leakage","Has no effect once the channel is short","Reduces gate capacitance, speeding the transistor up"],"In a short channel the drain's field helps pull down the source barrier, so off-current rises with VDS.","b"],
["05-25","M","Channel-length modulation means that in saturation:",["The drain current still rises slightly as VDS increases","The current stays exactly constant as VDS rises","The current falls slightly as VDS increases","The gate starts to conduct a small current"],"The pinch-off point moves toward the source, shortening the effective channel and giving a finite output resistance."],
["05-26","M","Two off NMOS transistors stacked in series leak:",["Much less than one off transistor","Twice as much as one off transistor","Exactly as much as one off transistor","Nothing, because two off devices block fully"],"The node between them rises slightly, giving the top transistor a negative VGS and the bottom one a smaller VDS. This is the stack effect."],
["05-27","M","Libraries offer the same cell with high-Vt and low-Vt transistors so that designers can:",["Use low-Vt cells only on critical paths, high-Vt cells elsewhere","Use low-Vt cells everywhere, since they also leak the least","Use high-Vt cells on critical paths, since they switch fastest","Pick a single Vt for the whole chip and skip leakage analysis"],"Multi-Vt optimization trades speed against leakage path by path."],
["05-28","M","High-k gate dielectrics, such as hafnium oxide, were introduced to:",["Cut gate tunneling leakage while keeping strong gate control","Make the gate oxide physically thinner to raise capacitance","Remove the need for a gate electrode altogether","Raise every transistor's threshold to about 1 V"],"A physically thicker high-k layer gives the same capacitance as ultra-thin SiO₂ but blocks tunneling current.","b"],
["05-29","H","There is a gate voltage at which a MOSFET's current barely changes with temperature, because falling Vt and falling mobility cancel. It is called the:",["ZTC (zero-temperature-coefficient) point","Threshold (turn-on) voltage","Pinch-off (saturation) voltage","Flat-band (zero-field) voltage"],"Below the ZTC point current rises with temperature (the Vt effect wins); above it current falls (mobility wins). Low supply voltages near or below it show temperature inversion.","vb"],
["05-30","E","A PMOS transistor turns on when its gate is:",["At least |Vtp| below its source","Above its source","At the same voltage as its drain","Floating"],"VSG > |Vtp|. With the source at VDD, a gate at 0 V turns it on."],
["05-31","M","A PMOS pass transistor with its gate at 0 V passes a strong:",["1","0","Z","Neither value"],"PMOS passes a full VDD but can only pull down to |Vtp|.","v"],
// 6 Analog
["06-01","M","An inverting amplifier has Rin = 2 kΩ, Rf = 10 kΩ and Vin = 0.3 V. What is Vout?",["−1.5 V","+1.5 V","−0.06 V","+1.8 V"],"Gain = −Rf/Rin = −5."],
["06-02","E","A non-inverting amplifier has Rf = 9 kΩ and Rg = 1 kΩ. Its gain is:",["10","9","−9","0.1"],"Gain = 1 + Rf/Rg."],
["06-03","M","With negative feedback, an ideal op-amp's two golden rules are:",["No current flows into the inputs, and the output drives V+ and V− to be equal","Infinite current flows into the inputs, and V+ is always 0","The output always equals V+, whatever the feedback","The gain always equals Rf, independent of Rin"],"These two rules solve nearly every op-amp circuit."],
["06-04","E","An op-amp used with no feedback to compare two inputs acts as a:",["Comparator (a 1-bit ADC)","Voltage follower (a buffer)","Integrator (a ramp generator)","Low-pass filter (a smoother)"],"The huge gain slams the output to its maximum or minimum."],
["06-05","E","A voltage follower (output tied to V−) has a gain of:",["1 (a unity-gain buffer)","0 (it blocks the signal)","Infinite (the open-loop gain)","−1 (an inverting buffer)"],"It lets a weak source drive a heavy load."],
["06-06","H","An NMOS biased at ID = 100 μA with 0.2 V overdrive drives RD = 10 kΩ in a common-source amplifier. The gain is about:",["−10","−1","+10","−100"],"gm = 2ID/Vov = 1 mA/V, and Av = −gm·RD = −10."],
["06-07","M","One step of a 12-bit ADC with a 3.3 V range is about:",["0.81 mV","3.3 mV","0.27 V","8.1 mV"],"3.3/4096 ≈ 0.81 mV."],
["06-08","M","A signal contains frequencies up to 20 kHz. The minimum sampling rate is:",["Just above 40 kHz","20 kHz","10 kHz","Above 200 kHz"],"Sample faster than twice the highest frequency (the Nyquist rate)."],
["06-09","M","Aliasing is caused by:",["Sampling slower than twice the highest signal frequency","Using more ADC bits than the signal needs","A DAC that is too slow for the sample rate","Negative feedback around the input amplifier"],"Fast components then masquerade as slow ones."],
["06-10","H","An LDO converts 3.3 V to 1.0 V for a 2 A load. How much power does the regulator waste?",["4.6 W","2 W","6.6 W","0.6 W"],"(3.3 − 1.0) × 2 = 4.6 W, for an efficiency of about 30%."],
["06-11","E","For a large voltage step-down, a switching (buck) regulator is generally more efficient than a linear regulator.",true,"Buck converters are typically 85–95% efficient; a linear regulator burns the whole voltage difference."],
["06-12","E","Which statement is correct?",["A BJT is current-controlled; a MOSFET is voltage-controlled","Both are current-controlled","A MOSFET's gate needs a steady base current","A BJT has an insulated gate"],"A BJT needs base current (IC = βIB); a MOSFET gate draws no DC current."],
["06-13","M","The cutoff frequency of an RC low-pass filter is:",["1/(2πRC)","RC","2πRC","0.69RC"],"Below it signals pass; above it they are attenuated."],
["06-14","M","In a basic current mirror, two matched transistors share the same VGS, so:",["The output copies the reference current, scaled by W/L","The output current is zero, since the gates draw none","The output voltage equals the input voltage","The two currents add at the output node"],"Equal VGS and equal size give equal saturation current. Doubling the output transistor's width doubles the copy.","b"],
["06-15","M","A differential amplifier rejects noise that appears equally on both of its inputs. This is measured by its:",["CMRR (common-mode rejection ratio)","Slew rate (maximum output slope)","Gain-bandwidth product (GBW)","PSRR (power-supply rejection ratio)"],"It amplifies the difference and ignores the common part.","b"],
["06-16","H","A bandgap reference produces a temperature-stable voltage by adding:",["A voltage that falls with temperature and one that rises with it","Two voltages that both rise with temperature, scaled by resistors","A resistor and a capacitor whose drifts cancel at room temperature","The supply voltage and ground, divided down by matched resistors"],"The opposite slopes cancel to first order, giving about 1.2 V.","b"],
["06-17","M","A PLL multiplies a 100 MHz reference with a divide-by-N counter in its feedback path. With N = 20, its output is:",["2 GHz","5 MHz","100 MHz","120 MHz"],"The loop adjusts the oscillator until f_out/N = f_ref."],
["06-18","M","A PLL's output jitter matters to a digital designer because:",["It reduces the timing margin left in every cycle","It raises the chip's supply voltage","It changes the logic function computed","It only matters for analog blocks"],"Timing analysis subtracts clock uncertainty (jitter plus margin) from the period."],
// 7 Binary, Boolean and number formats
["07-01","E","Decimal 45 in hexadecimal is:",["0x2D","0x45","0x2B","0x3D"],"45 = 101101₂ = 0010 1101 = 0x2D.","a"],
["07-02","E","0xB7 in decimal is:",["183","187","173","117"],"11 × 16 + 7 = 183.","a"],
["07-03","E","The range of an 8-bit two's complement number is:",["−128 to 127","−127 to 127","0 to 255","−256 to 255"],"−2ⁿ⁻¹ to 2ⁿ⁻¹ − 1.","a"],
["07-04","M","−20 in 8-bit two's complement is:",["1110 1100","1001 0100","1110 1011","0001 0100"],"+20 = 0001 0100. Invert: 1110 1011. Add 1: 1110 1100.","a"],
["07-05","M","How many bits do you need to give 1000 items unique IDs?",["10","9","11","1000"],"⌈log₂ 1000⌉ = 10, since 2¹⁰ = 1024."],
["07-06","H","For x = 1011 0110, what is x & (x − 1)?",["1011 0100","1011 0111","0000 0010","1011 0101"],"x − 1 = 1011 0101, and ANDing with x clears the lowest set bit."],
