<style>
/* Layout: a problem-list app. Slim top bar, list + progress sidebar, quest path, focused problem page. */
:root {
  /* Light theme: the warm paper, near-black ink and lavender/pink accents of IBM's Quantum posters */
  --bg: #ECE9E2; --surface: #F7F5F0; --surface-2: #E4E0D7; --row: #F7F5F0; --ink: #161616; --muted: #5D5A55; --line: #D6D1C6;
  --accent: #00753E; --accent-ink: #FFFFFF; --accent-soft: #E3F8EB; --accent-line: #A4D8B9; --accent-hover: #005F32;
  --primary: #161616; --primary-ink: #F7F5F0;
  --go: #161616; --go-ink: #F7F5F0;
  --easy: #198038; --medium: #A16207; --hard: #D02670;
  --easy-soft: #DEF5E5; --medium-soft: #FEF3C7; --hard-soft: #FFE3EE;
  --ok: #198038; --ok-soft: #DEF5E5; --warn: #8E6A00; --warn-soft: #FCF4D6; --bad: #D02670; --bad-soft: #FFE3EE;
  --code-bg: #E4E0D7; --editor-bg: #161616; --editor-ink: #F4F4F4; --gutter: #6F6F6F; --editor-line: #2A2A2A;
  --shadow: 0 8px 24px rgba(22, 22, 22, 0.07); --shadow-sm: 0 1px 2px rgba(22, 22, 22, 0.06);
  --nav-bg: #F7F5F0; --nav-line: #D6D1C6; --nav-ink: #4A4744; --nav-ink-strong: #161616; --nav-feature: #00753E; --nav-feature-hover: #005F32; --nav-ring: #D6D1C6;
  --pink: #EE5396; --lav: #2FA866; --node-c: #2563EB; --node-r: #EE5396;
  --em-color: var(--ink); --eyebrow: var(--ink); --selection: #CDEFD9;
  --hover-soft: #E3F8EB; --hover-line: #A4D8B9; --hover-ink: #00753E;   /* hover stays the light green from the earlier theme */
  --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 0;
}
:root[data-theme="dark"] {
    --hover-soft: #15301F; --hover-line: #2E6B45; --hover-ink: #5FD38D;
    --pink: #F47C93; --lav: #86E2AA; --node-c: #60A5FA; --node-r: #F2B65A; --em-color: var(--accent); --eyebrow: var(--accent); --selection: #15301F;
    --bg: #0F120F; --surface: #161A16; --surface-2: #1D221D; --row: #161A16; --ink: #ECEFE8; --muted: #9AA095; --line: #2A302A;
    --accent: #5FD38D; --accent-ink: #0F120F; --accent-soft: #15301F; --accent-line: #2E6B45; --accent-hover: #86E2AA;
    --primary: #5FD38D; --primary-ink: #0F120F;
    --go: #5FD38D; --go-ink: #0F120F;
    --easy: #5FD38D; --medium: #F2B65A; --hard: #F47C93;
    --easy-soft: #15301F; --medium-soft: #33270F; --hard-soft: #3A1820;
    --ok: #5FD38D; --ok-soft: #15301F; --warn: #F2B65A; --warn-soft: #33270F; --bad: #F47C93; --bad-soft: #3A1820;
    --code-bg: #1D221D; --editor-bg: #121512; --editor-ink: #E6E9E3; --gutter: #545C51; --editor-line: #222822;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35); --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --nav-bg: #161A16; --nav-line: #2A302A; --nav-ink: #B7BCB2; --nav-ink-strong: #ECEFE8; --nav-feature: #5FD38D; --nav-feature-hover: #86E2AA; --nav-ring: #2A302A;
    color-scheme: dark;
}

* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
h1, h2, h3 { font-weight: 650; line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.wide { max-width: 1240px; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--nav-bg); border-bottom: 1px solid var(--nav-line); padding-top: env(safe-area-inset-top, 0px); color: var(--nav-ink-strong); }
.topbar .wrap { max-width: 1240px; display: flex; align-items: center; gap: 0 28px; min-height: 62px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; color: var(--nav-ink-strong); text-decoration: none; }
.brand .logo { width: 30px; height: 30px; flex: none; }
.brand .bname { font-size: 1.32rem; font-weight: 500; letter-spacing: -0.01em; }
.navlinks { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.navlinks button { background: none; border: 0; padding: 0 12px; min-height: 62px; color: var(--nav-ink); cursor: pointer; font-size: 1.1rem; font-weight: 400; white-space: nowrap; }
.navlinks button:hover { color: var(--nav-ink-strong); }
.navlinks button[aria-current="page"] { color: var(--nav-ink-strong); }
.navlinks button.feature { color: var(--nav-feature); }
.navlinks button.feature:hover, .navlinks button.feature[aria-current="page"] { color: var(--nav-feature-hover); }
.topright { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.solved { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; white-space: nowrap; }
.topbar .muted { color: var(--nav-ink); }
.topbar .ring .ring-bg { stroke: var(--nav-ring); }
.topbar .ring .ring-fg { stroke: var(--nav-feature); }
.acctbtn { background: none; border: 1px solid var(--nav-line); color: var(--nav-ink-strong); padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 0.92rem; }
.acctbtn:hover { border-color: var(--nav-ink); }
.avatar { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); font-weight: 700; cursor: pointer; }
.acctrow { border-top: 1px solid var(--line); padding-top: 12px; }
.sync { font-size: 0.78rem; color: var(--nav-ink); white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
.ring .ring-bg { fill: none; stroke: var(--line); }
.ring .ring-fg { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .4s ease; }

.main { padding-top: 22px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 18px; }

/* Generic blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); padding: 8px 15px; border-radius: 3px; cursor: pointer; font-weight: 550; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.go { background: var(--go); border-color: var(--go); color: var(--go-ink); }
.btn.go:hover { filter: brightness(1.06); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 5px 11px; font-size: 0.86rem; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn:disabled, .iconbtn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.iconbtn { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 3px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 550; }
.linkbtn:hover { text-decoration: underline; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pill { font-size: 0.78rem; padding: 2px 8px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.progress { height: 6px; background: var(--surface-2); border-radius: 1px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.d-E { color: var(--easy); } .d-M { color: var(--medium); } .d-H { color: var(--hard); }
.dpill { font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 2px; background: var(--surface-2); }
.tag { font-size: 0.7rem; padding: 1px 6px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-weight: 550; }
.tag.t-oa { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tag.t-var { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tag.t-rep { color: var(--ink); }
.topicchip { font-size: 0.8rem; padding: 3px 9px; border-radius: 2px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.topicchip:hover { border-color: var(--muted); }

/* Status icons */
.st { display: inline-grid; place-items: center; width: 20px; height: 20px; }
.st svg { width: 18px; height: 18px; }
.st.solved { color: var(--ok); }
.st.attempted { color: var(--medium); }
.st.wrongmark { color: var(--bad); }

/* Problem list */
.pgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.pmain { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pside { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 76px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { font-size: 0.84rem; padding: 4px 10px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; white-space: nowrap; }
.tchip span { color: var(--muted); font-size: 0.75rem; margin-left: 2px; }
.tchip:hover { border-color: var(--muted); }
.tchip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tchip.on span { color: inherit; opacity: .7; }
.fbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fbar input[type="search"] { flex: 2 1 200px; }
.fbar select { flex: 1 1 118px; }
.fbar .fbtns { flex: none; margin-left: auto; }
.fbar input, .fbar select { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; min-width: 0; width: 100%; }
.fbtns { display: flex; gap: 6px; }
.fcount { font-size: 0.86rem; color: var(--muted); }
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ptable { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ptable th { text-align: left; font-size: 0.8rem; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ptable td { padding: 9px 12px; font-size: 0.92rem; vertical-align: middle; }
.ptable tbody tr:nth-child(odd) { background: var(--row); }
.ptable tbody tr[data-open] { cursor: pointer; }
.ptable tbody tr[data-open]:hover { background: var(--hover-soft); }
.ptable .c-st { width: 64px; }
.ptable .c-tp { width: 180px; color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptable .c-ty { width: 60px; color: var(--muted); font-size: 0.85rem; }
.ptable .c-df { width: 86px; font-weight: 600; font-size: 0.86rem; }
.ptable .c-ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptable .c-ti a, .ptable .c-ti .plain { text-decoration: none; }
.ptable .c-ti a:hover { color: var(--hover-ink); }
.ptable .c-ti .tags { margin-left: 8px; display: inline-flex; gap: 4px; vertical-align: 1px; }
.ptable td.empty { text-align: center; color: var(--muted); padding: 28px; white-space: normal; }
.progcard .progring { position: relative; width: 120px; height: 120px; margin: 4px auto; }
.progcard .ringlabel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.progcard .ringlabel b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.progcard .ringlabel span { color: var(--muted); font-size: 0.85rem; }
.progcard .ringlabel small { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
.dbars { display: flex; flex-direction: column; gap: 8px; }
.dbar { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 0.86rem; font-weight: 600; }
.dbar .mono { color: var(--muted); font-weight: 400; }
.dbar .bar { grid-column: 1 / 3; height: 6px; border-radius: 1px; background: var(--surface-2); overflow: hidden; }
.dbar .bar b { display: block; height: 100%; background: currentColor; }
.slists { display: flex; flex-direction: column; gap: 4px; }
.slists .sub { margin-top: 8px; }
.slist { display: flex; justify-content: space-between; gap: 10px; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 2px; cursor: pointer; font-size: 0.88rem; }
.slist:hover { background: var(--surface-2); }
.slist.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.slist .mono { color: var(--muted); font-size: 0.82rem; }
.slist:disabled { opacity: .5; cursor: default; }

/* Problem page */
.pv { max-width: 860px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.pvbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pvcard { gap: 16px; padding: 22px; }
.pvhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.solvedmark { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-weight: 600; font-size: 0.9rem; }
.solvedmark svg { width: 16px; height: 16px; }
.attmark { color: var(--medium); font-weight: 600; font-size: 0.9rem; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.82rem; color: var(--muted); }
.qtext { font-size: 1.08rem; max-width: 70ch; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 11px 14px; border-radius: 3px; cursor: pointer; width: 100%; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .key { font-family: var(--font-mono); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 2px; padding: 0 6px; color: var(--muted); flex: none; margin-top: 2px; }
.opt.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.verdict b { font-size: 1.25rem; }
.verdict.ok b { color: var(--ok); } .verdict.bad b { color: var(--bad); }
.verdict span { color: var(--muted); font-size: 0.92rem; }
.sol { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }
.sol small { color: var(--muted); font-size: 0.82rem; }
.pvactions { border-top: 1px solid var(--line); padding-top: 14px; }

/* Coding */
.ctable .c-ty { width: 120px; }
.ctable .c-tp { width: 170px; }
.tag.t-run { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.codecount { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--nav-line); }
.cpv-wrap { display: flex; flex-direction: column; gap: 10px; }
.cpv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 10px; height: calc(100vh - 150px); min-height: 560px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.ptabs, .ctabs { display: flex; align-items: center; gap: 2px; padding: 0 8px; min-height: 40px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex: none; }
.ptabs button, .ctabs button[role="tab"] { background: none; border: 0; padding: 0 10px; min-height: 40px; cursor: pointer; color: var(--muted); font-size: 0.88rem; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ptabs button:hover, .ctabs button[role="tab"]:hover { color: var(--ink); }
.ptabs button[aria-selected="true"], .ctabs button[role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.ctabs .btn { min-height: 30px; padding: 4px 14px; }
.ctabs .btn + .btn { margin-left: 6px; }
.ctitle { font-size: 0.88rem; font-weight: 500; padding: 0 10px; }
.spacer { flex: 1; }
.pscroll { overflow: auto; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.cstate .body { display: flex; flex-direction: column; gap: 10px; max-width: 72ch; }
.cstate .hintbox { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.cstate .sol { border-top: 0; padding-top: 0; }
.ceditor { min-width: 0; }
.ehead { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; min-height: 40px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex: none; }
.elang { font-size: 0.85rem; font-weight: 500; }
.editor { flex: 1; min-height: 200px; display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--editor-bg); font: 0.86rem/1.6 var(--font-mono); tab-size: 4; }
.editor .gutter { margin: 0; padding: 12px 10px 12px 14px; color: var(--gutter); text-align: right; overflow: hidden; user-select: none; font: inherit; border-right: 1px solid var(--line); min-width: 44px; }
.ed-area { position: relative; min-width: 0; }
.editor .hl, .editor textarea { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: inherit; white-space: pre; overflow: auto; tab-size: 4; border: 0; letter-spacing: 0; word-spacing: 0; }
.editor .hl { color: var(--ink); pointer-events: none; overflow: hidden; }
.editor textarea { background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: none; -webkit-text-fill-color: transparent; }
.editor textarea::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.editor:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
.editor i { font-style: normal; }
.console { flex: none; height: 42%; min-height: 170px; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.cbody { overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
.casechips { display: flex; flex-wrap: wrap; gap: 6px; }
.casechip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 3px 10px; font-size: 0.82rem; cursor: pointer; color: var(--muted); }
.casechip.on { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.casechip.pass { color: var(--ok); } .casechip.fail { color: var(--bad); }
.tcase { display: flex; flex-direction: column; gap: 10px; }
.kv { display: flex; flex-direction: column; gap: 4px; }
.kv > span { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.kv pre.code { white-space: pre-wrap; overflow-wrap: anywhere; }
.vhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.vhead h3 { font-size: 1.2rem; font-weight: 600; }
.v-ok { color: var(--ok); } .v-bad { color: var(--bad); }
pre.code.err { color: var(--bad); }
.subs { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.subs th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.subs td { padding: 8px; border-bottom: 1px solid var(--line); }
.subs td.v-ok, .subs td.v-bad { font-weight: 600; }
.runmsg { font-size: 0.9rem; display: flex; align-items: center; gap: 10px; color: var(--muted); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

/* Quest map */
.hero { flex-direction: row; justify-content: space-between; align-items: center; gap: 20px; }
.hero > div:first-child { display: flex; flex-direction: column; gap: 10px; max-width: 64ch; }
.herostat { display: flex; align-items: center; gap: 12px; flex: none; }
.herostat b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.herostat span { font-size: 0.85rem; color: var(--muted); }
.realm { display: flex; flex-direction: column; gap: 6px; }
.realmhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding: 8px 2px; }
.realmhead .eyebrow { color: var(--accent); }
/* Quest map: a grid of quest cards, no staircase */
.path.qgrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.qgrid > .node { display: flex; }
.qgrid .nodebtn { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s, transform .15s; }
.qgrid .nodebtn:hover { border-color: var(--hover-line); box-shadow: var(--shadow); transform: translateY(-1px); }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qnum { font: 600 1.5rem/1 var(--font-mono); color: var(--line); letter-spacing: -0.02em; }
.qst { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.qst svg { width: 12px; height: 12px; }
.qst.ok { background: var(--ok-soft); color: var(--ok); }
.qst.cur { background: var(--accent); color: var(--accent-ink); }
.qtitle { font-size: 1rem; line-height: 1.3; }
.qbar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.qgrid small { color: var(--muted); font-size: 0.78rem; }
.qgo { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
.qgrid .node.done .qnum { color: var(--accent-line); }
.qgrid .node.done .qbar i { background: var(--ok); }
.qgrid .node.current .nodebtn { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.qgrid .node.current .qnum { color: var(--accent); }
.qgrid .node.locked .nodebtn { background: var(--surface-2); box-shadow: none; }
.qgrid .node.locked .qtitle { color: var(--muted); }
.hero { flex-wrap: wrap; }
.roadmap { flex-basis: 100%; display: grid; grid-template-columns: repeat(23, 1fr); gap: 4px; }
.roadmap i { height: 6px; border-radius: 999px; background: var(--surface-2); }
.roadmap i.done { background: var(--ok); }
.roadmap i.cur { background: var(--accent-line); }

/* Quest page */
.unitv { display: flex; flex-direction: column; gap: 16px; }
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; color: var(--muted); flex-wrap: wrap; }
.unithead { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.unithead > div { display: flex; flex-direction: column; gap: 6px; max-width: 62ch; }
.ustats { display: flex; gap: 8px; margin: 0; flex-wrap: wrap; }
.ustats div { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 6px 12px; min-width: 92px; }
.ustats dt { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.ustats dd { margin: 0; font-weight: 650; font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.steps li { display: flex; align-items: center; }
.steps li + li::before { content: ""; width: 16px; height: 2px; background: var(--line); margin-right: 8px; }
.step { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 650; display: grid; place-items: center; }
.step svg { width: 16px; height: 16px; }
.step.done { background: var(--ok); border-color: var(--ok); color: var(--go-ink); }
.step.cur { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.done.cur { border-color: var(--ok); }
.step:disabled { cursor: not-allowed; opacity: .5; }
.lessoncard .body { display: flex; flex-direction: column; gap: 10px; font-size: 1.02rem; max-width: 68ch; }
.locked .lockline { display: flex; gap: 14px; align-items: flex-start; }
.locked .lockline > svg { width: 28px; height: 28px; color: var(--muted); flex: none; margin-top: 2px; }
.qcard { gap: 14px; }
.qcard.inline { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; }

/* Sessions */
.quiz { max-width: 860px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.qtop { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.timer { font-family: var(--font-mono); padding: 4px 10px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); border-color: var(--bad); }
.qnav { display: flex; flex-wrap: wrap; gap: 4px; }
.qnav button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); font-family: var(--font-mono); font-size: 0.78rem; cursor: pointer; }
.qnav button.ans { background: var(--accent-soft); border-color: var(--accent); }
.qnav button.cur { outline: 2px solid var(--accent); }
.scoreline { display: flex; align-items: center; gap: 14px; }
.scoreline .big { font-size: 2rem; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.results { display: flex; flex-direction: column; }
.result { border-top: 1px solid var(--line); }
.result:first-child { border-top: 0; }
.result summary { display: flex; align-items: center; gap: 10px; padding: 10px 2px; cursor: pointer; list-style: none; }
.result summary::-webkit-details-marker { display: none; }
.result .rq { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result[open] .rq { white-space: normal; }
.result .rbody { padding: 0 2px 14px 30px; display: flex; flex-direction: column; gap: 6px; font-size: 0.93rem; }
.hist { display: flex; flex-direction: column; }
.hist > div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 0.9rem; }
.hist > div:first-child { border-top: 0; }

/* Job match */
.rtable { width: 100%; border-collapse: collapse; }
.rtable th { text-align: left; font-size: 0.8rem; color: var(--muted); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.rtable td { padding: 9px 12px; font-size: 0.92rem; border-top: 1px solid var(--line); }
.reviews { display: flex; flex-direction: column; }
.review { border-top: 1px solid var(--line); padding: 14px 0; display: flex; flex-direction: column; gap: 8px; }
.review:first-child { border-top: 0; padding-top: 0; }
.rhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.vpill { font-size: 0.75rem; font-weight: 650; padding: 2px 8px; border-radius: 2px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.vpill.ok { background: var(--ok-soft); color: var(--ok); } .vpill.warn { background: var(--warn-soft); color: var(--warn); } .vpill.bad { background: var(--bad-soft); color: var(--bad); }
.review dl { display: grid; grid-template-columns: 130px 1fr; gap: 4px 14px; margin: 0; font-size: 0.9rem; }
.review dl div { display: contents; }
.review dt { color: var(--muted); }
.review dd { margin: 0; }
.areas { display: flex; flex-direction: column; gap: 12px; }
.area { display: flex; flex-direction: column; gap: 6px; }

/* Interactive widgets (lessons) */
.widget { border: 1px dashed var(--line); background: var(--surface-2); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.widget .wlabel { font-size: 0.74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 650; }
.wctl { display: grid; gap: 8px; }
.wrow { display: grid; grid-template-columns: minmax(110px, 190px) 1fr auto; gap: 10px; align-items: center; font-size: 0.9rem; }
.wrow .wl { color: var(--muted); }
.wrow select, .wrow input[type="text"] { grid-column: 2 / 4; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-width: 0; }
.wrow input[type="text"] { font-family: var(--font-mono); }
.wrow input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
.wrow .wv { font-family: var(--font-mono); font-size: 0.85rem; min-width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
.wcheck { grid-template-columns: auto 1fr; }
.wcheck input { accent-color: var(--accent); width: 18px; height: 18px; }
.wout { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.wstats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.wstat { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px; min-width: 0; }
.wstat span { display: block; font-size: 0.78rem; color: var(--muted); }
.wstat b { font-family: var(--font-mono); font-size: 1rem; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.wstat.ok b { color: var(--ok); } .wstat.warn b { color: var(--warn); } .wstat.bad b { color: var(--bad); } .wstat.accent b { color: var(--accent); }
.wstat.mono b { font-size: 0.95rem; }
.wnote { font-size: 0.9rem; color: var(--muted); }
.wwin { font-weight: 600; color: var(--ok); }
.wbar { height: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 1px; overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.wbar.ok i { background: var(--ok); } .wbar.warn i { background: var(--warn); } .wbar.bad i { background: var(--bad); }
.wsvg { width: 100%; max-width: 520px; height: auto; }
.wsvg .ax { stroke: var(--muted); stroke-width: 1; }
.wsvg .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; }
.wsvg .mark { stroke: var(--ok); stroke-dasharray: 3 3; } .wsvg .mark2 { stroke: var(--muted); stroke-dasharray: 2 3; }
.wsvg .tick, .wsvg .mlab { fill: var(--muted); font: 10px var(--font-mono); }
.tblwrap { overflow-x: auto; }
table.tt { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.9rem; }
table.tt th, table.tt td { border: 1px solid var(--line); padding: 5px 12px; text-align: center; background: var(--surface); }
table.tt th { color: var(--muted); font-weight: 500; }
.tok { color: var(--ok); } .tbad { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.8rem; padding: 3px 8px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.chip.done { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.invwrap { display: grid; grid-template-columns: minmax(150px, 200px) 1fr; gap: 14px; align-items: start; }
.invdiag { display: flex; flex-direction: column; align-items: stretch; gap: 6px; font-family: var(--font-mono); font-size: 0.82rem; text-align: center; }
.invdiag .rail { color: var(--muted); border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.invdiag .rail:last-child { border-bottom: 0; border-top: 2px solid var(--line); padding-top: 2px; padding-bottom: 0; }
.dev { border: 2px solid var(--line); border-radius: 2px; padding: 6px; display: flex; justify-content: space-between; background: var(--surface); }
.dev.on { border-color: var(--ok); } .dev.on span { color: var(--ok); } .dev.off span { color: var(--muted); }
.invdiag .node { padding: 4px; background: var(--accent-soft); border-radius: 2px; }
table.wave { border-collapse: separate; border-spacing: 2px; font-family: var(--font-mono); font-size: 0.8rem; }
table.wave th { text-align: left; font-weight: 500; color: var(--muted); padding-right: 8px; white-space: nowrap; }
table.wave th small { font-size: 0.7rem; }
table.wave td { width: 26px; min-width: 26px; height: 24px; padding: 0; }
table.wave td.edge { color: var(--accent); text-align: center; height: 14px; font-size: 0.7rem; }
table.wave td.hi { background: var(--accent); border-radius: 2px; }
table.wave td.lo { background: var(--line); height: 4px; vertical-align: bottom; border-radius: 1px; }
table.wave td.hi.clk { background: var(--muted); }
table.wave td.hi.q2 { background: var(--ok); }
.dbtn { width: 26px; height: 24px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; padding: 0; }
.dbtn.hi { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dbtn.lo { background: var(--surface); color: var(--muted); }
.abar { display: flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; min-height: 54px; }
.aseg { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; min-width: 52px; font-size: 0.8rem; }
.aseg b { font-family: var(--font-mono); font-weight: 500; } .aseg span { color: var(--muted); font-size: 0.74rem; }
.aseg.s1 { background: var(--accent-soft); } .aseg.s2 { background: var(--ok-soft); } .aseg.s3 { background: var(--surface); }
.fpbits { font-family: var(--font-mono); font-size: 0.92rem; overflow-wrap: anywhere; letter-spacing: 0.04em; }
.fpbits .fs { color: var(--bad); } .fpbits .fe { color: var(--ok); } .fpbits .fm { color: var(--accent); }

/* Toasts */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 20; max-width: min(340px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 3px; font-size: 0.92rem; box-shadow: 0 6px 20px rgba(0,0,0,.2); animation: tin .25s ease; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (max-width: 1000px) {
  .pgrid { grid-template-columns: minmax(0, 1fr); }
  .cpv { grid-template-columns: minmax(0, 1fr); height: auto; }
  .cstate.panel { max-height: none; }
  .ceditor { height: 820px; }
  .pside { position: static; order: -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .progcard { display: grid; grid-template-columns: 104px 1fr; gap: 6px 18px; align-items: center; }
  .progcard h2, .progcard > p { grid-column: 1 / 3; }
  .progcard .progring { width: 104px; height: 104px; margin: 0; }
  .progcard .progring .ring { width: 104px; height: 104px; }
  .fbar input[type="search"] { flex-basis: 100%; }
  .fbtns { grid-column: 1 / 3; justify-content: flex-end; }
}
@media (max-width: 720px) {
  .sync { display: none; }
  .navlinks { order: 3; width: 100%; gap: 0; margin-left: -10px; }
  .topbar .wrap { padding-top: 8px; gap: 0 16px; }
  .brand .bname { font-size: 1.15rem; }
  .studycard { display: none; }
  .chiprow { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .navlinks button { padding: 0 7px; min-height: 44px; font-size: 0.95rem; }
  .ptable .c-tp, .ptable .c-ty, .ptable .c-co { display: none; }
  .ptable .c-st { width: 40px; }
  .ptable th.c-st { font-size: 0; }
  .codecount { display: none; }
  .ceditor { height: 700px; }
  .ptable .c-df { width: 70px; }
  .ptable td, .ptable th { padding-left: 8px; padding-right: 8px; }
  .ptable .c-ti .tags { display: none; }
  .hero { flex-direction: column; align-items: flex-start; }
  .path.qgrid { grid-template-columns: 1fr; }
  .wrow { grid-template-columns: 1fr auto; }
  .wrow .wl { grid-column: 1 / 3; }
  .wrow select, .wrow input[type="text"] { grid-column: 1 / 3; }
  .invwrap { grid-template-columns: 1fr; }
  .review dl { grid-template-columns: 1fr; }
  .review dt { margin-top: 4px; }
  .rhead { flex-direction: column; }
  .pvcard { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Soft, rounded look (after TensorTonic): floating top bar, pill chips, badges, soft cards, dark editor */
body { -webkit-font-smoothing: antialiased; }
::selection { background: var(--selection); color: var(--ink); }
.topbar { background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 0 6px; }
.topbar .wrap { background: var(--nav-bg); border: 1px solid var(--nav-line); border-radius: 16px; box-shadow: var(--shadow); min-height: 56px; padding-left: 18px; padding-right: 10px; gap: 0 22px; max-width: 1240px; }
.brand .logo { width: 26px; height: 26px; }
.brand .bname { font-size: 1.08rem; font-weight: 700; letter-spacing: -0.02em; }
.navlinks { gap: 2px; }
.navlinks button { min-height: 56px; padding: 0 11px; font-size: 0.9rem; font-weight: 500; }
.navlinks button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.navlinks button.feature { color: var(--nav-ink); }
.navlinks button.feature[aria-current="page"] { color: var(--accent); }
.solved { font-size: 0.86rem; }
.acctbtn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 7px 18px; font-weight: 600; font-size: 0.88rem; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 18%, transparent); }
.acctbtn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.avatar { background: var(--accent); color: var(--accent-ink); }
.main { padding-top: 18px; }
.card { border-radius: var(--radius); border-color: color-mix(in srgb, var(--line) 85%, transparent); box-shadow: var(--shadow-sm); padding: 20px; }
.btn { border-radius: 8px; font-weight: 600; background: var(--surface); }
.btn:hover { border-color: var(--hover-line); background: var(--surface-2); }
.btn.primary, .btn.go { border-radius: 999px; padding-left: 18px; padding-right: 18px; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 18%, transparent); }
.btn.primary:hover, .btn.go:hover { background: var(--accent-hover); border-color: var(--accent-hover); filter: none; }
.btn.ghost { border-radius: 8px; }
.iconbtn { border-radius: 8px; background: var(--surface); }
.iconbtn:hover:not(:disabled) { border-color: var(--hover-line); }
.linkbtn { color: var(--accent); }
.pill, .tag, .topicchip { border-radius: 999px; }
.pill { padding: 2px 10px; }
.tag { padding: 1px 8px; }
.topicchip { padding: 3px 11px; background: var(--surface-2); border-color: transparent; }
.progress, .dbar .bar { border-radius: 999px; height: 7px; }
.progress i, .dbar .bar b { border-radius: 999px; }
.dpill, .dbadge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid transparent; line-height: 1.5; }
.dpill.d-E, .dbadge.d-E { background: var(--easy-soft); color: var(--easy); border-color: color-mix(in srgb, var(--easy) 22%, transparent); }
.dpill.d-M, .dbadge.d-M { background: var(--medium-soft); color: var(--medium); border-color: color-mix(in srgb, var(--medium) 22%, transparent); }
.dpill.d-H, .dbadge.d-H { background: var(--hard-soft); color: var(--hard); border-color: color-mix(in srgb, var(--hard) 22%, transparent); }
.tchip { border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-weight: 500; background: var(--surface-2); border-color: transparent; }
.tchip:hover { border-color: var(--hover-line); }
.tchip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.tchip.on span { color: inherit; opacity: .75; }
.fbar input, .fbar select { border-radius: 8px; padding: 8px 12px; }
.fbar input:focus, .fbar select:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.tablewrap { border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.ptable th { background: var(--surface-2); font-weight: 500; font-size: 0.78rem; padding: 11px 14px; }
.ptable td { padding: 12px 14px; border-top: 1px solid var(--line); }
.ptable tbody tr:first-child td { border-top: 0; }
.ptable tbody tr:nth-child(odd) { background: transparent; }
.ptable tbody tr[data-open]:hover, .ptable tbody tr[data-copen]:hover { background: color-mix(in srgb, var(--hover-soft) 55%, transparent); }
.ptable tbody tr[data-copen] { cursor: pointer; }
.ptable .c-df { width: 100px; }
.slist { border-radius: 8px; }
.opt { border-radius: 10px; }
.opt .key { border-radius: 6px; }
.timer, .ustats div { border-radius: 10px; }
.qnav button { border-radius: 8px; }
.widget { border-radius: var(--radius); }
code { border-radius: 5px; border-color: transparent; background: var(--surface-2); }
pre.code { border-radius: 10px; border-color: transparent; }
.hero { padding: 28px; background: radial-gradient(120% 140% at 100% 0%, var(--accent-soft) 0%, transparent 55%), var(--surface); }
.hero h1 { font-size: clamp(1.8rem, 3.4vw, 2.6rem); letter-spacing: -0.03em; line-height: 1.08; font-weight: 700; }
